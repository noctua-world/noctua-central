# Every text the interface itself says (`NOCTUA.md §12`, `§15.2`).
#
# A sentence, a word or a control's name the desktop interface shows that is no
# command's and no error's: the daemon alert line, the confirmation surface,
# the prompt's send control, the words of the modeline, the names its parts
# are read out by. What a command is called is its entry in `commands.toml`,
# and what a refusal says is its message in `errors.toml`; neither is repeated
# here.
#
# Same contract as `notifications.toml`: a text not declared here does not
# exist, the interface shows one by a generated handle
# (`nc_catalog::interface::Text`), and its key resolves in both locales.
#
# * `id` is two or more lower-case words joined by dots, and names the handle.
# * `text` is the message key, always `interface.` and the id.
# * `params` is checked against the placeholders in the sentence. A sentence is
#   one key: a count that reads differently for one and for many is two texts.
# * `shown` says, in one English sentence, where the interface shows it — what
#   a translator and a reviewer place it by, published in `docs/interface.md`.

