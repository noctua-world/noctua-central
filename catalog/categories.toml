# The categories an entry is listed under (`NOCTUA.md §20.4`).
#
# A category is a name a list shows an entry under, and this file is the closed
# set of them: a command's `categories` names categories written here, and the
# build refuses any other. Categories come in sets — a standard's, or the
# platform's own — and a category is named for its set, a dot, and a slug of
# lower-case letters and digits in words joined by hyphens:
# `freedesktop.web-browser`.
#
# A set:
#
#   name          lower-case words, which every category of the set is named under
#   title         the key of its display name in `catalog/i18n/`
#   description   the key of its line description, one line of at most 80
#                 characters
#   standard      whether a standard outside the platform defines it
#   defined_by    what defines it: the standard, or this catalog
#   version       the version of the standard it was read from, or the date it
#                 was read where the standard has no version: a standard set's
#                 alone, and required there
#
# A category:
#
#   name           `<set>.<slug>`, under the set it is in
#   set            the set it is in
#   standard_name  what its standard calls it, as the standard writes it:
#                  required in a standard set and refused in the platform's own
#   role           where its standard ranks it — `main`, `additional` or
#                  `reserved` — for a standard that ranks its categories: every
#                  category of such a set carries one, and no other category
#                  does
#   title          the key of its display name
#   description    the key of its line description
#
# A category carries a display name and a line description in every locale,
# held to the entry judge every command's texts are held to, and nothing else:
# no paragraph and no tags. A name that is the same in both languages — a
# desktop project's or a toolkit's — is exempt from the untranslated rule with
# its reason, in `THE_SAME_IN_BOTH` in
# `crates/nc-catalog-compiler/src/messages.rs`.
#
# **What a standard says is copied from it, never from memory.** The sets below
# hold every row of the two sources Stage 14 saved, and nothing else:
#
# * `freedesktop` — every category the freedesktop.org Desktop Menu
#   Specification 1.1 registers, main, additional and reserved, in its order
#   (https://specifications.freedesktop.org/menu-spec/latest/). The slug is the
#   standard name in kebab case, split where a lower-case letter meets a capital
#   and where a letter meets a digit, an acronym kept whole: `AudioVideo` is
#   `audio-video`, `2DGraphics` is `2d-graphics`, `IRCClient` is `irc-client`.
#   A line description is the specification's own, cut to one line where it is
#   longer; `Construction` has none there, so its line is this catalog's own.
# * `apple` — every value of Apple's `LSApplicationCategoryType`
#   (https://developer.apple.com/documentation/bundleresources/information-property-list/lsapplicationcategorytype),
#   in Apple's order, the games subcategories after `games`. The slug is what
#   follows `public.app-category.`. Apple describes none of them, so every line
#   description is this catalog's own words.
# * `noctua` — the platform's own: what its commands are listed under.

[[set]]
name = "freedesktop"
title = "category-set.freedesktop.title"
description = "category-set.freedesktop.description"
standard = true
defined_by = "freedesktop.org Desktop Menu Specification"
version = "1.1"

[[set]]
name = "apple"
title = "category-set.apple.title"
description = "category-set.apple.description"
standard = true
defined_by = "Apple's Information Property List key LSApplicationCategoryType"
version = "as published on 2026-11-14"

[[set]]
name = "noctua"
title = "category-set.noctua.title"
description = "category-set.noctua.description"
standard = false
defined_by = "this catalog"

