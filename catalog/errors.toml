[[error]]
code = "NC-PLUG-0015"
description = "A network request did not complete: no answer, a timeout, or a connection that failed"
message = "error.plugin.network-unavailable"
severity = "warning"
retryable = true

[[error]]
# **A surface the kernel will not keep.** A tree `ui.render` is handed outside
# the closed set of nodes `crates/nc-kernel/src/ui.rs` documents, past one of
# its bounds, naming a command the registry does not hold or arguments that
# command's schema does not name; and a surface opened under a title no person
# could read. Refused as a value, and the surface keeps the last tree it held.
code = "NC-PLUG-0016"
description = "A plugin rendered a surface the kernel refuses"
message = "error.plugin.ui-invalid"
severity = "warning"
retryable = false

[[error]]
# A running plugin refused at a bound the catalog declares on what it holds,
# sends, queues or opens: a quota, a queue or a count. Where it is raised is
# `grep -rln PluginBoundReached crates/nc-kernel/src`, rather than a list here,
# which would miss each bound added after it was written. Each is a limit
# Noctua sets, which is all the message says. A load refused for declaring more
# than `commands_per_plugin` commands is NC-PLUG-0009: that plugin keeps
# nothing and is never started, which this message does not say.
code = "NC-PLUG-0017"
description = "A plugin reached a bound the catalog declares: a quota, a queue or a count"
message = "error.plugin.bound-reached"
severity = "warning"
retryable = false

[[error]]
code = "NC-PLUG-0018"
description = "A write was refused because what it expected to replace had changed"
message = "error.plugin.store-conflict"
severity = "info"
retryable = false

[[error]]
# **Not there, or not the plugin's: one answer for both.** A timer `timers.cancel`
# names and a surface `ui.close-surface` or `ui.render` names are each the
# plugin's own or nothing, so one another plugin holds is answered as one that
# does not exist, and a plugin learns nothing of another's from the refusal.
code = "NC-PLUG-0019"
description = "A plugin asked for a key, a timer, a surface or a command that is not there"
message = "error.plugin.not-found"
severity = "info"
retryable = false

[[error]]
code = "NC-PLUG-0020"
description = "A plugin answered with a result that is not canonical, or that is too large"
message = "error.plugin.malformed-result"
severity = "error"
retryable = false

[[error]]
code = "NC-PLUG-0021"
description = "A plugin did not activate: it trapped, ran out of fuel, outgrew its memory or refused while it was instantiated or activated"
message = "error.plugin.activation-failed"
severity = "error"
retryable = false

[[error]]
code = "NC-PLUG-0022"
description = "A plugin was not loaded: its identity or its namespace is held by a loaded plugin, or its namespace is one the kernel keeps"
message = "error.plugin.identity-taken"
severity = "error"
retryable = false

[[error]]
# **The plugin's own answer, in its own words, under the kernel's code.** A
# command a plugin runs may answer with any of the world's errors, and the text
# is the plugin's: this is the code every such refusal carries to whoever
# dispatched it, with the case the plugin chose, so a refusal the kernel made
# and one the plugin made are never told apart by guessing at a sentence.
code = "NC-PLUG-0023"
description = "A plugin's command refused what it was asked, answering one of the world's errors in its own words"
message = "error.plugin.command-refused"
severity = "info"
retryable = false

[[error]]
# **A frame that may only read.** `activate`, a callback and a command declared
# a read write nothing themselves — a timer's callback changes state only
# through the commands it dispatches, in the unit it may begin for them — so a
# write there is refused rather than put anywhere; and from `activate` no
# command runs at all, so a dispatch there has no one to run as. Refused as a
# value: the plugin lives on.
code = "NC-PLUG-0024"
description = "A plugin wrote where only reading is allowed — in activate, a callback or a command declared a read — or dispatched from activate, where no command runs"
message = "error.plugin.read-only-frame"
severity = "warning"
retryable = false

[[error]]
# **Nobody to act for.** Reading who a call runs for, publishing an event,
# setting a timer and opening, closing or rendering a surface each act for the
# person a call tree runs on behalf of, and `activate` runs in none. Refused as
# a value: the plugin lives on, and may do each once a command or a callback of
# it runs.
code = "NC-PLUG-0025"
description = "A plugin called, where no call tree runs, a host function that acts for the person one runs for: the context, an event, a timer or a surface"
message = "error.plugin.outside-a-call-tree"
severity = "warning"
retryable = false

[[error]]
# **A topic is the publisher's.** An event is published under lower-case words
# joined by dots, beginning with the namespace the plugin's manifest names, so
# a subscriber's pattern says whose events it hears and no plugin can speak in
# another's name. Refused as a value, and nothing is queued.
code = "NC-PLUG-0026"
description = "A plugin published an event under a topic that is not one, or that is outside its namespace"
message = "error.plugin.topic-refused"
severity = "warning"
retryable = false

[[error]]
# **Not `NC-PLUG-0018`, which is a conflict.** A revision the store never
# writes is the plugin's defect: nothing changed meanwhile, and the same write
# is refused the same way however often it is tried.
code = "NC-PLUG-0027"
description = "A plugin's write named, as the revision it expects to replace, text that is not a revision"
message = "error.plugin.not-a-revision"
severity = "warning"
retryable = false

[[error]]
# **A handle is a unit's only while the unit lasts.** One aborted, let go, or
# begun in a command that has returned has ended — whether its unit was kept or
# not — so a method called on it does nothing, and is refused as a value: the
# plugin lives on, and the call aborts nothing. Not `NC-KERN-0008`, which says
# a unit was aborted: the handle of a unit that was kept is refused too, in a
# command whose own unit nothing doomed, and that sentence is false of it.
code = "NC-PLUG-0028"
description = "A plugin called a method on the handle of a unit that had ended — aborted, let go, or begun in a command that has returned — and the call did nothing"
message = "error.plugin.unit-ended"
severity = "warning"
retryable = false

