# English — the source locale.
#
# Every key in this file must exist in every other locale, and every key in
# another locale must exist here. A key missing from either side **fails the
# build**, naming the entry and the text it is (`NOCTUA.md §10.9`): a lookup
# that quietly fell back to English would ship a page in two languages and
# report nothing.
#
# Two tables. `[tags]` holds the lists of words a search finds an entry by — a
# command's tags (`§20.4`) — each list this locale's own words, as long as it
# needs to be; `[message]`, after it and to the end of the file, holds the
# sentences.
#
# Conventions:
#
# * Keys are dotted and quoted, so TOML reads them as literal strings rather than
#   nesting. That keeps this a flat list a translator can read top to bottom
#   without tracking which table they are inside.
# * Placeholders are `{name}`, and a locale's set must match this file's exactly.
# * **A sentence is one key.** Never assemble a message from fragments: word
#   order is not a constant across languages.
# * Backend responses carry a key and parameters, never a rendered sentence
#   (`§10.9`). These are the sentences those keys resolve to.
# * Written for a beginner, brief and precise (`§10.10`): what happened, and what
#   the reader can do about it. No error code in the text — the code travels
#   beside the message, and a reader who needs it is shown it.

[meta]
name  = "English"
bcp47 = "en"
dir   = "ltr"

# The words a search finds each entry by, one list per entry. A list is this
# locale's own words: it need not be a translation of another locale's, nor be
# as long, and a word may be the same in both.
[tags]

# --- Commands ---
"command.journal.verify.tags" = ["verify", "check", "history", "activity", "integrity", "audit"]
"command.limits.prune.tags" = ["prune", "clean up", "old records", "limit", "free space"]
"command.kernel.undo.tags" = ["undo", "take back", "revert", "go back"]
"command.kernel.redo.tags" = ["redo", "do again", "repeat", "restore"]

[message]

