# --- The catalog's own mechanism entries ---
# These two pairs exist to prove the generated typed handles resolve in both
# locales. They are the entries a stage with a real notification or email
# replaces, and they are visible in the developer surfaces so nobody wonders
# what they are.
"notification.catalog.mechanism.title" = "Noctua is working"
"notification.catalog.mechanism.body" = "Hello {name}. This message exists so that Noctua can check its own notifications reach you correctly."
"email.catalog.mechanism.subject" = "Noctua is working"
"email.catalog.mechanism.body" = "This message exists so that Noctua can check its own email reaches you correctly. Nothing is expected of you."

# --- Commands ---
"command.journal.verify.title" = "Verify activity history"
"command.journal.verify.description" = "Check that every recorded action is intact and in order."
"command.journal.verify.paragraph" = "Reads the activity history from its start, or from the entry you name, and checks that each recorded action is still linked to the one before it. It changes nothing, and answers how many entries it checked, or the first one that does not hold and why."
"command.limits.prune.title" = "Clear old records"
"command.limits.prune.description" = "Remove the oldest records from any table that has passed its limit."
"command.limits.prune.paragraph" = "Deletes the oldest records from each table of this device's database that has passed its declared limit, or only from the table you name. A dry run counts what it would remove and removes nothing. What it removes cannot be brought back, so undo stops at the step that ran it."
"command.kernel.undo.title" = "Undo"
"command.kernel.undo.description" = "Take back your last step: what it changed in Noctua, and the files it made."
"command.kernel.undo.paragraph" = "Finds your newest step that can still be taken back and puts back every value it changed and the files it made, after checking again that you may do each thing it did. It stops at a step whose effects left this device, and at one whose values changed since."
"command.kernel.redo.title" = "Redo"
"command.kernel.redo.description" = "Make again the last step you took back."
"command.kernel.redo.paragraph" = "Puts back the newest step you took back, as long as you have done nothing new since, after checking again that you may do each thing it did. A step whose undo needed corrections of its own cannot be redone."
"command.naming.propose.title" = "Propose a file name"
"command.naming.propose.description" = "Build a file name from a title, signature, keywords and extension."
"command.naming.propose.paragraph" = "Writes the name Noctua gives a saved file: its signature, title, keywords, identifier and extension, each cleaned of what a file name cannot hold. A file being renamed keeps the identifier you give, so it stays the same file; without one, a new identifier is made. It saves nothing and changes nothing."
"command.naming.read.title" = "Read a file name"
"command.naming.read.description" = "Read a file name back into its identifier, signature, title and keywords."
"command.naming.read.paragraph" = "Reads a name written in Noctua's file-naming scheme and answers what it holds: the identifier, the signature, the title, the keywords and the extension. It also says whether the name is already written exactly as Noctua writes it, and gives the spelling Noctua would use. It changes nothing."
"command.kernel.find.title" = "Find a command"
"command.kernel.find.description" = "Find commands by any word of their names or tags, in English or Portuguese."
"command.kernel.find.paragraph" = "Looks through every command Noctua can run, its own and every plugin's, for those whose names and tags, in English and in Portuguese, hold every word you type, each as letters in order, with accents and capitals ignored. It answers the best matches first, at most as many as you ask for, with where each word was found, and how many were found in all. It changes nothing."
"command.settings.mcp.read.title" = "Read whether MCP is on"
"command.settings.mcp.read.description" = "Show whether this installation of Noctua lets MCP clients in."
"command.settings.mcp.read.paragraph" = "Answers whether MCP is on in this installation of Noctua. It is off until a person turns it on, and turning it on here turns it on nowhere else. It changes nothing."
"command.settings.mcp.set.title" = "Switch MCP on or off"
"command.settings.mcp.set.description" = "Let MCP clients act here as agents, or stop them."
"command.settings.mcp.set.paragraph" = "Turns MCP on or off in this installation of Noctua, and in no other. While it is off, no MCP client is let in; while it is on, a client acts only as an agent you made and granted, never as you. Only you can switch it, asking directly, never from inside another action, and switching it on waits for you to confirm it in the Noctua window. Undo puts it back as it was; when that would switch it on, the undo waits for you to confirm it in the Noctua window too."
"command.settings.leader.read.title" = "Read the Leader"
"command.settings.leader.read.description" = "Show the keys that reach Noctua from anywhere."
"command.settings.leader.read.paragraph" = "Answers the Leader in use in this installation of Noctua: the keys that show Noctua from anywhere on the computer, written as their places on the keyboard. It changes nothing."
"command.settings.leader.set.title" = "Change the Leader"
"command.settings.leader.set.description" = "Choose the keys that reach Noctua from anywhere."
"command.settings.leader.set.paragraph" = "Changes the Leader of this installation of Noctua, and of no other. The Leader needs at least one of Control, Alt, Shift and Super held with its key, and it is refused when it would clash with the key added to it or with another installation's Leader, or when the system does not give it to Noctua. A refused choice changes nothing. Only you can change it, asking directly, never from inside another action. Undo stops at this step: to go back, choose the Leader you had."
"command.settings.chord.read.title" = "Read the added key"
"command.settings.chord.read.description" = "Show the key held with the Leader for more shortcuts."
"command.settings.chord.read.paragraph" = "Answers the key that, held with the Leader, reaches a second set of shortcuts in this installation of Noctua. It is Shift until you choose another. It changes nothing."
"command.settings.chord.set.title" = "Change the added key"
"command.settings.chord.set.description" = "Choose the key held with the Leader for more shortcuts."
"command.settings.chord.set.paragraph" = "Changes the key that, held with the Leader, reaches a second set of shortcuts, in this installation of Noctua and in no other: one of Control, Alt, Shift and Super. It is refused when the Leader already holds it, or when the Leader held with it would be another installation's Leader. A refused choice changes nothing. Only you can change it, asking directly, never from inside another action. Undo stops at this step: to go back, choose the key you had."
"command.settings.menu-keys.read.title" = "Read the leader menu's keys"
"command.settings.menu-keys.read.description" = "Show each key of the leader menu and what it runs."
"command.settings.menu-keys.read.paragraph" = "Answers every key of the leader menu in use in this installation of Noctua, each beside the command it runs: Noctua's own keys, with your choices over them. It changes nothing."
"command.settings.menu-keys.set.title" = "Change the leader menu's keys"
"command.settings.menu-keys.set.description" = "Choose each key of the leader menu and what it runs."
"command.settings.menu-keys.set.paragraph" = "Replaces every key of the leader menu in this installation of Noctua, and in no other, with the keys you give, each beside the command it runs. A command you leave out is not in the menu. One key runs one command, so a key given twice is refused, and a refused choice changes nothing. Only you can change them, asking directly, never from inside another action. Undo stops at this step: to go back, give the keys you had."
"command.settings.chords.read.title" = "Read the chords"
"command.settings.chords.read.description" = "Show each key pressed with the Leader held and what it runs."
"command.settings.chords.read.paragraph" = "Answers every key that acts while the Leader is held in this installation of Noctua, each beside the command it runs and whether the added key is held as well: Noctua's own keys, with your choices over them. It changes nothing."
"command.settings.chords.set.title" = "Change the chords"
"command.settings.chords.set.description" = "Choose each key pressed with the Leader held and what it runs."
"command.settings.chords.set.paragraph" = "Replaces every key that acts while the Leader is held in this installation of Noctua, and in no other, with the keys you give, each beside the command it runs and whether the added key is held as well. A command you leave out has no chord. One key runs one command, so a key given twice the same way is refused, and a refused choice changes nothing. Only you can change them, asking directly, never from inside another action. Undo stops at this step: to go back, give the keys you had."
"command.settings.footer.read.title" = "Read the footer's visibility"
"command.settings.footer.read.description" = "Show whether the footer is always shown."
"command.settings.footer.read.paragraph" = "Answers whether the footer of the Noctua window is always shown or stays hidden until you ask for it, in this installation of Noctua. It is always shown until you choose otherwise. It changes nothing."
"command.settings.footer.set.title" = "Change the footer's visibility"
"command.settings.footer.set.description" = "Keep the footer always shown, or hidden until needed."
"command.settings.footer.set.paragraph" = "Chooses whether the footer of the Noctua window is always shown or stays hidden, in this installation of Noctua and in no other. Hidden, it comes back when you press the Leader or move the pointer to the bottom edge of the window, and goes away again when you leave it. The choice is kept until you change it, and undo does not take it back: choose again instead."
"command.settings.language.read.title" = "Read the language"
"command.settings.language.read.description" = "Show the language chosen for the Noctua window."
"command.settings.language.read.paragraph" = "Answers the language chosen for the Noctua window in this installation of Noctua: your system's language, or one you chose. It is your system's until you choose another. It changes nothing."
"command.settings.language.set.title" = "Change the language"
"command.settings.language.set.description" = "Choose the language for the Noctua window."
"command.settings.language.set.paragraph" = "Chooses the language for the Noctua window, in this installation of Noctua and in no other: your system's language, English or Brazilian Portuguese. Where your system's language is neither, your system's means English. The choice is kept until you change it, and undo does not take it back: choose again instead."
"command.settings.appearance.read.title" = "Read the appearance"
"command.settings.appearance.read.description" = "Show whether the Noctua window is chosen light or dark."
"command.settings.appearance.read.paragraph" = "Answers the mode chosen for the Noctua window, in this installation of Noctua: your system's, light or dark. It is your system's until you choose another. It changes nothing."
"command.settings.appearance.set.title" = "Change the appearance"
"command.settings.appearance.set.description" = "Choose a light or a dark Noctua window, or your system's mode."
"command.settings.appearance.set.paragraph" = "Chooses the mode for the Noctua window, in this installation of Noctua and in no other: light, dark, or whichever your system prefers. The choice is kept until you change it, and undo does not take it back: choose again instead."
"command.agents.create.title" = "Make an agent"
"command.agents.create.description" = "Make an agent that acts for you, with a budget of its own."
"command.agents.create.paragraph" = "Makes a new agent of yours: an identity of its own that an MCP client acts as, for you alone. You give it a label and a budget, which each of its sessions spends one at a time, and it can do nothing until you grant it a feature. Only you can make one, asking directly, never from inside another action. An agent is never deleted, so undo stops at the step that made it."
"command.agents.list.title" = "List your agents"
"command.agents.list.description" = "Show the agents you made, each with what you granted it and until when."
"command.agents.list.paragraph" = "Answers every agent you made, in the order you made them, with its label, its budget and each grant you gave it and have not ended, even one whose time is up: its feature, why you gave it, and from when until when. It changes nothing."
"command.agents.grant.title" = "Grant an agent a feature"
"command.agents.grant.description" = "Let one of your agents use a feature, for a reason and a time you give."
"command.agents.grant.paragraph" = "Lets one of your agents, named by the identifier Noctua gave it, use one feature for as many minutes as you say, within the longest a grant may run, and keeps why. A new grant on the same feature ends the one before it, and the agent still does only what you yourself may do. Only you can grant it, asking directly, never from inside another action. To take it back, revoke it: undo stops at a grant."
"command.agents.revoke.title" = "Revoke an agent's access"
"command.agents.revoke.description" = "End what you granted one of your agents: one feature, or all of them."
"command.agents.revoke.paragraph" = "Ends the grant one of your agents holds on the feature you name, or every grant it holds when you name none, from its very next action. The agent itself is kept, with its budget, for you to grant again. Only you can revoke, asking directly, never from inside another action, and undo stops at a revocation."
"command.shell.read.title" = "Read the interface's state"
"command.shell.read.description" = "Show all the interface holds: its windows, pages, drawer, prompt and seats."
"command.shell.read.paragraph" = "Answers the whole state of the desktop interface as Noctua keeps it: each window and the pages open in it, the drawer, the sidebar, the footer, the info line, the prompt and what each seat is on, with the revision it is at. Asked from inside a command that changed the interface, it answers that change instead, which is not Noctua's until the command ends, and with no revision. It changes nothing."
"command.shell.focus.title" = "Move a seat's focus"
"command.shell.focus.description" = "Give a seat's keyboard to a part of an interface window."
"command.shell.focus.paragraph" = "Moves the keyboard focus of one seat — the system's own unless you name another — to a part of a window: its workspace area, the drawer, the prompt line, the sidebar, the info line or the modeline. Every window of the interface follows it. A keyboard on a drawer that shows nothing open goes back to the prompt line, whichever command left the drawer so."
"command.shell.hover.title" = "Say what a seat points at"
"command.shell.hover.description" = "Record what a seat's pointer hovers, or what its keyboard selection is on."
"command.shell.hover.paragraph" = "Records what one seat's pointer is over, or what its keyboard selection is on, so the info line can say what it is; naming nothing clears it. The info line shows whichever of the two changed last."
"command.shell.drag.title" = "Say what a seat drags"
"command.shell.drag.description" = "Record what a seat is dragging, or that it stopped."
"command.shell.drag.paragraph" = "Records what one seat is dragging in the interface, so every window shows it being dragged; naming nothing says the drag ended."
"command.window.open.title" = "Open another window"
"command.window.open.description" = "Open one more window of the interface, showing the same state."
"command.window.open.paragraph" = "Opens another window of the desktop interface, shown at once. Every window shows the same drawer, prompt and footer, and each keeps a stack of pages of its own. The interface holds only so many windows."
"command.window.show.title" = "Show a window"
"command.window.show.description" = "Show a window of the interface that is hidden."
"command.window.show.paragraph" = "Shows a window of the desktop interface — the one you are using, unless you name another — exactly as it was when it was hidden."
"command.window.hide.title" = "Hide a window"
"command.window.hide.description" = "Hide a window of the interface, keeping everything in it."
"command.window.hide.paragraph" = "Hides a window of the desktop interface — the one you are using, unless you name another. Nothing stops: what was open in it is kept, and showing it again brings it all back."
"command.window.close.title" = "Close a window"
"command.window.close.description" = "Close a window of the interface, or hide it when it is the last one."
"command.window.close.paragraph" = "Closes a window of the desktop interface — the one you are using, unless you name another — with the pages only it showed. The last window is hidden instead, so the interface is always ready to show again. Nothing that runs in Noctua stops."
"command.window.move.title" = "Move a window"
"command.window.move.description" = "Place a window of the interface at a position on the screen."
"command.window.move.paragraph" = "Moves a window of the desktop interface — the one you are using, unless you name another — so its top left corner is at the position given, in the screen's own units. Under a tiling window manager, the manager may place it elsewhere."
"command.window.resize.title" = "Resize a window"
"command.window.resize.description" = "Give a window of the interface a new width and height."
"command.window.resize.paragraph" = "Resizes a window of the desktop interface — the one you are using, unless you name another — in CSS pixels. A window is never made smaller than the smallest size every page is built for."
"command.leader.tap.title" = "Tap the Leader"
"command.leader.tap.description" = "Do what one tap of the Leader key does in the interface."
"command.leader.tap.paragraph" = "Does what a tap of the Leader does: it shows the interface and its footer and puts the keyboard on the prompt line; tapped again there, it opens the leader menu in the drawer; and tapped while the menu is open in a window shown, it sends the next page opened to the other region — the drawer instead of the workspace area, or the other way round."
"command.confirmations.list.title" = "List what waits for a confirmation"
"command.confirmations.list.description" = "Show every call waiting for a person to confirm it in the Noctua window."
"command.confirmations.list.paragraph" = "Lists every call Noctua holds until a person confirms it in the Noctua window — one that cannot be undone, or one that switches MCP on: its number, the command, whether it can be undone, the person whose confirmation it waits for and the agent that asked for it when an agent did, and when the wait ends. Only the Noctua window can confirm or decline one; this command only shows them, and changes nothing."
"command.confirmations.read.title" = "Read what waits for a confirmation"
"command.confirmations.read.description" = "Show one call waiting for a confirmation, with the arguments it would run with."
"command.confirmations.read.paragraph" = "Shows the call Noctua holds under the number given until a person confirms it in the Noctua window: the command, the arguments it would run with, the person whose confirmation it waits for, the agent that asked for it when an agent did, and when the wait ends. A number nothing waits under any more is refused. It changes nothing."
"command.surfaces.list.title" = "List the surfaces open"
"command.surfaces.list.description" = "Show the surfaces plugins have open, and who drew what each shows."
"command.surfaces.list.paragraph" = "Lists every surface the plugins hold open: its name, where it is shown, its title, the plugin that holds it, and who drew what it shows now — the person the plugin acted for, and the agent that acted for them when one did. It does not show what each surface holds; read one surface for that. It changes nothing."
"command.surfaces.read.title" = "Read a surface"
"command.surfaces.read.description" = "Show one surface a plugin has open, with what it shows and who drew it."
"command.surfaces.read.paragraph" = "Shows the surface named: where it is shown, its title, the plugin that holds it, everything it shows now, and who drew that — the person the plugin acted for, and the agent that acted for them when one did. A surface no longer open is refused. It changes nothing."
"command.surfaces.activate.title" = "Press something on a surface"
"command.surfaces.activate.description" = "Run what a button or a toggle on a surface runs, as a click would."
"command.surfaces.activate.paragraph" = "Does what clicking a button or a toggle on a surface does: runs the action the surface itself names for it, with what you typed into the fields it uses, and nothing you name yourself. Something an agent drew is never run this way, since it would run with your authority. What it runs is decided and recorded as itself, and undo treats it as that command's own step."
"command.kernel.history.title" = "Show the next undo"
"command.kernel.history.description" = "Name the step your next undo takes back, and whether an agent took it."
"command.kernel.history.paragraph" = "Shows the step your next undo would take back: its name, when it was taken, whether undo stops there, and the agent that took it when one of your agents did — an agent's steps are yours to undo, as your own are. It changes nothing."
"command.dev.limits.read.title" = "Show limits in use"
"command.dev.limits.read.description" = "Show how full each bounded table and count on this machine is."
"command.dev.limits.read.paragraph" = "Lists each table of this machine's database with the rows it holds and the bound it declares, and each count the local server keeps against a limit — agents' sessions, connections, calls waiting for confirmation, log lines kept — with how many are in use now. A bound counted for each plugin or each unit is shown beside the whole table's rows, which it does not bound. Limits that are a size or a time have no use to show; the limits page lists them. It changes nothing."
"command.dev.plugins.read.title" = "Show loaded plugins"
"command.dev.plugins.read.description" = "List each loaded plugin with what it was granted and what it uses."
"command.dev.plugins.read.paragraph" = "Lists the plugins the local server loaded, a page at a time: each one's identity and namespace, the capabilities it was granted, how many commands it declares, the surfaces and timers it holds, the lines its own log keeps, how often it was stopped and started again, why it was last stopped, and whether it is quarantined. It changes nothing."
"command.dev.sessions.read.title" = "Show agents' sessions"
"command.dev.sessions.read.description" = "List the agents' sessions the local server holds open now."
"command.dev.sessions.read.paragraph" = "Shows each session an agent holds open on the local server, by the agent's identifier, with how many sessions and connections are open and the most the server allows of each. It changes nothing."
"command.dev.agents.read.title" = "Show agents' tables in use"
"command.dev.agents.read.description" = "Show how full the tables that keep agents and their grants are."
"command.dev.agents.read.paragraph" = "Shows the two tables of this machine's database that keep the agents people made and the grants they gave them: the rows each holds and the bound at which a new agent or a new grant is refused. It counts rows and shows no agent; listing your agents is its own command. It changes nothing."
"command.dev.policy.read.title" = "Show the policy pack"
"command.dev.policy.read.description" = "Show the realm's policy pack, its version and its policy epoch."
"command.dev.policy.read.paragraph" = "Shows which policy pack decides what may be done in this realm: the pack and its version, as the realm pins it and the local server carries it, and the realm's policy epoch, which moves each time its permissions change. It changes nothing."
"command.dev.logs.read.title" = "Read the live log"
"command.dev.logs.read.description" = "Read the newest log lines this machine's local server recorded."
"command.dev.logs.read.paragraph" = "Reads a page of the lines the local server on this machine recorded since it started, oldest first, each under the number it was recorded at, and says where the next page starts, so reading again from there follows the log as it grows. Only the newest lines are kept, in memory. A line holds an event's name, its level and its declared fields — codes, counts and identifiers, never text a person wrote. It changes nothing."
"command.dev.journal.read.title" = "Browse the journal"
"command.dev.journal.read.description" = "Read a page of the realm's journal, entry by entry."
"command.dev.journal.read.paragraph" = "Reads a page of the realm's journal from the entry you name, oldest first: who asked, for whom, which command, on what, how it was decided and by which policy, in which unit of work, and when. It says where the next page starts and which entry is the newest, and names an entry it could not read instead of skipping it. It changes nothing; verifying the journal's chain is its own command."
"command.page.open.title" = "Open a page"
"command.page.open.description" = "Open a page of the interface: settings, help, dev, a surface or a list."
"command.page.open.paragraph" = "Opens a page in the workspace area of a window or in the drawer — where the drawer's direction says, unless you choose. A page already open is shown again where it is asked for, as one more view of the same page. Opening a page closes the leader menu."
"command.page.settings.title" = "Open settings"
"command.page.settings.description" = "Open the settings, where the leader menu's direction says."
"command.page.settings.paragraph" = "Opens the list of settings, as Leader s does: in the workspace area, or in the drawer when the leader menu's direction points there or a Leader tap flipped it for this page. Settings already open is shown again there."
"command.page.help.title" = "Open help"
"command.page.help.description" = "Open the help pages, where the leader menu's direction says."
"command.page.help.paragraph" = "Opens the list of help pages, as Leader h does: in the workspace area, or in the drawer when the leader menu's direction points there or a Leader tap flipped it for this page. Help already open is shown again there."
"command.page.dev.title" = "Open the dev pages"
"command.page.dev.description" = "Open the pages for developing and running Noctua."
"command.page.dev.paragraph" = "Opens the list of dev pages, as Leader d does: in the workspace area, or in the drawer when the leader menu's direction points there or a Leader tap flipped it for this page. Each dev page is authorized as any command is."
"command.page.shortcuts.title" = "Open the page's shortcuts"
"command.page.shortcuts.description" = "Open the shortcuts of the page in focus, in the drawer."
"command.page.shortcuts.paragraph" = "Opens, in the drawer, the list of the shortcuts the page in focus keeps for itself, as Leader / does. A page keeps its own shortcuts there rather than in the global bindings."
"command.page.actions.title" = "Open the window's actions"
"command.page.actions.description" = "Open the actions on the window and the page in focus, in the drawer."
"command.page.actions.paragraph" = "Opens, in the drawer, the list of what can be done to the window — hide it, close it, move it, resize it — as Leader w does. Choosing one runs it, asking for what it needs on the prompt line."
"command.page.close.title" = "Close a page"
"command.page.close.description" = "Close a page of the interface, in one place or everywhere it is shown."
"command.page.close.paragraph" = "Closes the page in focus in a window's workspace area or in the drawer, or the page you name — from the place you say, or from everywhere it is shown. A page nothing shows any more is closed for good; anything it started keeps running."
"command.page.focus.title" = "Bring a page to the front"
"command.page.focus.description" = "Show a page that is open, in the workspace area or in the drawer."
"command.page.focus.paragraph" = "Brings a page that is already open to the front of the place that shows it: a window's workspace area, or the drawer, which is expanded if it was collapsed."
"command.page.next.title" = "Show the next page"
"command.page.next.description" = "Bring the next page of a window's stack to the front."
"command.page.next.paragraph" = "Brings to the front the page after the one in focus in a window's workspace area. At the last page, nothing changes."
"command.page.previous.title" = "Show the previous page"
"command.page.previous.description" = "Bring the previous page of a window's stack to the front."
"command.page.previous.paragraph" = "Brings to the front the page before the one in focus in a window's workspace area. At the first page, nothing changes."
"command.page.into.title" = "Go into a sub-page"
"command.page.into.description" = "Open a sub-page inside a page, such as one topic of help."
"command.page.into.paragraph" = "Goes one step deeper inside a page — the one in focus, unless you name another — to the topic given, so going back returns to where it was. A page goes only so many steps deep."
"command.page.back.title" = "Go back in a page"
"command.page.back.description" = "Return from a sub-page to the page it was opened from."
"command.page.back.paragraph" = "Goes back one step inside a page — the one in focus, unless you name another. A page that is not inside a sub-page stays as it is."
"command.page.scroll.title" = "Scroll a page"
"command.page.scroll.description" = "Set how far a page is scrolled, so it reopens where it was."
"command.page.scroll.paragraph" = "Sets how far down a page is scrolled, in CSS pixels — the page in focus, unless you name another — so every window shows it there and reopening it brings you back to the same place."
"command.drawer.collapse.title" = "Collapse the drawer"
"command.drawer.collapse.description" = "Hide the whole drawer, keeping every page open in it."
"command.drawer.collapse.paragraph" = "Hides the drawer below the footer, keeping the pages open in it; the end of the modeline then shows how many there are. Expanding it brings everything back."
"command.drawer.expand.title" = "Expand the drawer"
"command.drawer.expand.description" = "Show the drawer again, with everything that was open in it."
"command.drawer.expand.paragraph" = "Shows the drawer below the footer again, as it was when it was collapsed."
"command.drawer.back.title" = "Go back in the drawer"
"command.drawer.back.description" = "Leave a sub-page of the drawer's page, or close that page if it has none."
"command.drawer.back.paragraph" = "Does what Esc does in the drawer: it goes back one step inside the drawer's page in focus or, when that page is not inside a sub-page, closes it in the drawer; a seat whose keyboard was on a drawer left showing nothing goes back to the prompt line."
"command.drawer.toward.title" = "Choose where pages open"
"command.drawer.toward.description" = "Open the leader menu's pages in the workspace area or in the drawer."
"command.drawer.toward.paragraph" = "Chooses where a page opened from the leader menu goes: the workspace area, where they go at first, or the drawer. The choice is kept until you change it."
"command.drawer.resize.title" = "Resize the drawer"
"command.drawer.resize.description" = "Set how much of the height the drawer takes, below half."
"command.drawer.resize.paragraph" = "Sets how much of the height the drawer shares with the workspace area it takes, in percent. It always stays shorter than the workspace area."
"command.sidebar.show.title" = "Show the sidebar"
"command.sidebar.show.description" = "Show the list of what is open in the interface."
"command.sidebar.show.paragraph" = "Shows the sidebar, the list of everything open in the interface."
"command.sidebar.hide.title" = "Hide the sidebar"
"command.sidebar.hide.description" = "Hide the list of what is open in the interface."
"command.sidebar.hide.paragraph" = "Hides the sidebar; a seat whose keyboard was on it goes back to the workspace area."
"command.sidebar.cycle.title" = "Show, focus or hide the sidebar"
"command.sidebar.cycle.description" = "Do what Leader Space does: show the sidebar, focus it, or hide it."
"command.sidebar.cycle.paragraph" = "Shows the sidebar when it is hidden, puts a seat's keyboard on it when it is shown, and hides it when the keyboard is already there."
"command.footer.show.title" = "Show the footer"
"command.footer.show.description" = "Show the footer's three lines now, even where the setting hides it."
"command.footer.show.paragraph" = "Shows the footer's three lines now. Where the footer is set to hide, it stays until nothing holds it there any more."
"command.footer.hide.title" = "Hide the footer"
"command.footer.hide.description" = "Let the footer hide again where the setting hides it."
"command.footer.hide.paragraph" = "Lets the footer hide again where it is set to hide. Where it is set to always show, it stays."
"command.info.say.title" = "Say something on the info line"
"command.info.say.description" = "Show a short message on the info line until it is cleared."
"command.info.say.paragraph" = "Shows a message on the info line, the middle line of the footer, in place of the one before it."
"command.info.clear.title" = "Clear the info line"
"command.info.clear.description" = "Take the message off the info line."
"command.info.clear.paragraph" = "Takes the message off the info line, which goes back to saying what each seat is on."
"command.info.expand.title" = "Expand the info line"
"command.info.expand.description" = "Let the info line grow to show all it holds, each hover on a line of its own."
"command.info.expand.paragraph" = "Lets the info line wrap and grow to show everything it holds, with what the pointer is over and what the keyboard is on each on a line of its own."
"command.info.collapse.title" = "Collapse the info line"
"command.info.collapse.description" = "Keep the info line to one line again."
"command.info.collapse.paragraph" = "Keeps the info line to one line again, cutting what does not fit."
"command.prompt.set.title" = "Type into the prompt line"
"command.prompt.set.description" = "Set what the prompt line holds, as if it were typed there."
"command.prompt.set.paragraph" = "Sets the text of the prompt line, the bottom line of the footer. Text that begins with a semicolon or a colon opens the list of commands in the drawer, and the rest of it filters the list."
"command.prompt.ask.title" = "Ask for a command's parameters"
"command.prompt.ask.description" = "Keep the prompt line on a command, asking for its parameters."
"command.prompt.ask.paragraph" = "Keeps the prompt line on the command you chose, offering its parameters — on the one you name, when you name one — so what you type next is a parameter's value."
"command.prompt.clear.title" = "Clear the prompt line"
"command.prompt.clear.description" = "Empty the prompt line and stop asking for anything."
"command.prompt.clear.paragraph" = "Empties the prompt line and stops asking for a command or its parameters, closing the list of commands in the drawer."

# --- Capabilities ---
"capability.context.description" = "Know who it is acting for: the person, anyone acting on their behalf, and whether a person confirmed this step."
"capability.store.description" = "Keep structured data of its own, which no other part of Noctua can read or change."
"capability.blobs.read.description" = "Find files by their content and read them, without loading a whole file into memory."
"capability.blobs.write.description" = "Save new files, and tell other devices that this one has them."
"capability.commands.dispatch.description" = "Ask other parts of Noctua to run their commands, each checked as if a person had asked."
"capability.commands.begin.description" = "Group several changes into one step that is kept whole or not at all, and undone as one."
"capability.events.publish.description" = "Announce that something happened, for other parts of Noctua to hear."
"capability.events.subscribe.description" = "Hear the announcements it names, and only those."
"capability.ui.description" = "Describe what it shows on screen, for Noctua to draw."
"capability.net.description" = "Reach the websites it names, and no others."
"capability.timers.description" = "Be woken after a while, or at a regular interval."

