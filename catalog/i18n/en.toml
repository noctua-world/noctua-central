"external-identifier.google-chrome.title" = "Google Chrome"
"external-identifier.google-chrome.description" = "Web browser"
"external-identifier.google-chrome.paragraph" = "The web browser Google distributes. This entry names it on Linux, macOS and Windows by what its own installers leave on each system, as measured there: the commands that start it, its desktop files, its application bundle and the paths it is installed at."
"external-identifier.chromium.title" = "Chromium"
"external-identifier.chromium.description" = "Open-source web browser"
"external-identifier.chromium.paragraph" = "The open-source web browser project. Each system's distributions package it under names of their own, so this entry names only what was measured on a system or is written in the project's own sources: the commands that start it on Linux, its bundle identifier and executable on macOS, and its executable on Windows."
