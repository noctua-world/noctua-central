# --- The catalog's own mechanism entries ---
# These two pairs exist to prove the generated typed handles resolve in both
# locales. They are the entries a stage with a real notification or email
# replaces, and they are visible in the developer surfaces so nobody wonders
# what they are.
"notification.catalog.mechanism.title" = "Noctua is working"
"notification.catalog.mechanism.body" = "Hello {name}. This message exists so that Noctua can check its own notifications reach you correctly."
"email.catalog.mechanism.subject" = "Noctua is working"
"email.catalog.mechanism.body" = "This message exists so that Noctua can check its own email reaches you correctly. Nothing is expected of you."

# --- Commands ---
"command.journal.verify.title" = "Verify activity history"
"command.journal.verify.description" = "Check that every recorded action is intact and in order."
"command.journal.verify.paragraph" = "Reads the activity history from its start, or from the entry you name, and checks that each recorded action is still linked to the one before it. It changes nothing, and answers how many entries it checked, or the first one that does not hold and why."
"command.limits.prune.title" = "Clear old records"
"command.limits.prune.description" = "Remove the oldest records from any table that has passed its limit."
"command.limits.prune.paragraph" = "Deletes the oldest records from each table of this device's database that has passed its declared limit, or only from the table you name. A dry run counts what it would remove and removes nothing. What it removes cannot be brought back, so undo stops at the step that ran it."
"command.kernel.undo.title" = "Undo"
"command.kernel.undo.description" = "Take back your last step: what it changed in Noctua, and the files it made."
"command.kernel.undo.paragraph" = "Finds your newest step that can still be taken back and puts back every value it changed and the files it made, after checking again that you may do each thing it did. It stops at a step whose effects left this device, and at one whose values changed since."
"command.kernel.redo.title" = "Redo"
"command.kernel.redo.description" = "Make again the last step you took back."
"command.kernel.redo.paragraph" = "Puts back the newest step you took back, as long as you have done nothing new since, after checking again that you may do each thing it did. A step whose undo needed corrections of its own cannot be redone."

# --- Capabilities ---
