"error.channel.leader-held-with-the-chord-is-anothers" = "The Leader and the key added to it, as your settings leave them, and those of another Noctua installation on this computer become one shortcut when either Leader is pressed with its added key, so Noctua kept this installation's standard Leader and added key."
"error.channel.leader-of-another-channel" = "The Leader, as your settings leave it, is already the Leader of another Noctua installation on this computer, so Noctua kept this installation's standard Leader and added key."
"error.channel.key-bound-twice" = "Your shortcut settings give one key to two commands, so Noctua kept the standard shortcuts of the commands."
"error.channel.keybindings-unjudged" = "Noctua could not read another installation's shortcut settings to check that your Leader and the key added to it do not clash with them, so it kept this installation's standard Leader and added key."
"error.channel.key-the-system-uses" = "A shortcut in use is one the computer's system also uses, so the system may answer it before Noctua does. Noctua kept it."
"error.channel.key-unpressable" = "A shortcut you chose is the Leader's own key pressed while holding the Leader, which no hand can press. Noctua kept it, but it cannot be used."
"error.channel.leader-taken" = "Another program already uses the Leader's keys, so pressing them does not reach Noctua. Free them in that program, or choose another Leader."
"error.channel.leader-no-session" = "Noctua is not running in a desktop session that lets it listen for the Leader, so pressing it does not reach Noctua from here."
"error.channel.leader-unregistered" = "The system did not let Noctua listen for the Leader, so pressing it does not reach Noctua. It is tried again when Noctua starts."
"error.channel.shortcut-leader-collides" = "The Leader and the key added to it, as you chose them, clash with each other or with another installation of Noctua, so nothing was changed. Choose another Leader or another added key."
"error.channel.shortcut-key-bound-twice" = "Two of the shortcuts you chose use the same key in the same list, so nothing was changed. Give each one a key of its own."
"error.channel.shortcut-key-reserved" = "A key you chose cannot be part of a shortcut, so nothing was changed. Choose a letter, a digit, a punctuation key, Space, Tab, Enter, Backspace, an arrow, one of the six keys above the arrows or F1 to F12."
"error.channel.shortcut-leader-undelivered" = "The system did not give Noctua the Leader you chose, because another program already uses those keys or the system could not be asked, so nothing was changed and your shortcuts stay as they were. Free the keys in that program, or choose another Leader."
"error.channel.shortcuts-unsaved" = "Noctua could not save your keyboard shortcut settings, so nothing was changed. Your shortcut file may be one another account can change, one this version of Noctua cannot read or too large, or its disk may be full or disconnected. Check the file and its disk, then try again."
"error.daemon.profile-not-private" = "A folder or file where Noctua keeps your data could be reached by another account on this computer, so Noctua did not use it and left it as it was."
"error.daemon.profile-unavailable" = "Noctua could not read or create a folder where it keeps your data. Check that the disk has room and is connected, then try again."
"error.daemon.no-device" = "This installation has no identity for this computer yet, so Noctua did not start. Install Noctua again."
"error.daemon.device-unreadable" = "This computer's identity in Noctua is damaged, so Noctua did not start. Someone needs to look at it."
"error.daemon.no-world" = "Noctua does not know whose it is on this computer yet, so it did not start."
"error.daemon.world-unreadable" = "The file saying whose Noctua this is could not be read, so Noctua did not start."
"error.daemon.mark-unreadable" = "Noctua could not read how far it has numbered what it saves, so it did not start rather than risk numbering something twice."
"error.daemon.instance-held" = "Noctua is already running for this installation, so a second copy did not start."
"error.daemon.not-running" = "Noctua is still starting, so it could not do that yet. Try again in a moment."
"error.daemon.stopping" = "Noctua is stopping, so it did not do that. Nothing was done."
"error.daemon.no-central-log" = "This installation names a place for Noctua's own log that Noctua cannot write to, so Noctua did not start. Install Noctua again."
"error.daemon.engine-refused" = "Noctua could not prepare what runs its plugins, so it did not start. Someone needs to look at it."
"error.daemon.pid-record-unreadable" = "The note saying which process is Noctua could not be read, so it was not trusted."
"error.daemon.mcp-off" = "MCP is off in this Noctua installation, so the MCP client was not let in, or was let go. A person switches it on in Noctua's settings."
"error.daemon.not-for-a-session" = "An MCP client only lists its tools and calls them, so Noctua did not do what it asked."
"error.daemon.too-many-sessions" = "Noctua already has as many MCP clients connected as it allows, so this one was not let in. Try again once another has closed."
"error.daemon.attach-refused" = "This connection did not prove it is the Noctua window this Noctua started, so it was closed."
"error.daemon.not-attached" = "Only the Noctua window this Noctua started answers a confirmation, so nothing was answered."
"error.ipc.frame-too-large" = "Something sent Noctua more at once than it accepts, so Noctua closed that connection."
"error.ipc.malformed" = "Something sent Noctua a message it does not understand, so Noctua closed that connection."
"error.ipc.lost" = "The connection to Noctua closed before it finished. Try again."
"error.ipc.protocol" = "This program and the running Noctua are different versions, so they could not talk to each other. Restart Noctua so both are the same version."
"error.ipc.client-unproven" = "Something tried to talk to Noctua without proving it belongs to this installation, so Noctua closed that connection."
"error.ipc.daemon-unproven" = "What answered could not prove it is this installation's Noctua, so nothing was sent to it."
"error.ipc.handshake-slow" = "The other side took too long to answer, so the connection to Noctua was closed. Try again."
"error.ipc.silent" = "The other side stopped answering, so the connection to Noctua was closed. Try again."
"error.ipc.endpoint-not-private" = "The place Noctua is reached through could be reached by another account on this computer, so Noctua did not use it and left it as it was."
"error.ipc.endpoint-too-long" = "The place Noctua is reached through has a longer name than this computer allows. Install Noctua again in a folder with a shorter path."
"error.ipc.endpoint-taken" = "Something else already answers where Noctua is reached, so Noctua did not take that place."
"error.ipc.peer-unverified" = "The other side of the connection could not be shown to be yours, so Noctua closed it."
"error.ipc.busy" = "Noctua already has as many connections open as it allows. Close one and try again."
"error.ipc.unreachable" = "Noctua is not running, so nothing answered. Start it and try again."
"error.ipc.endpoint-unavailable" = "Noctua could not open the place it is reached through. Try again."
"error.ipc.unsendable" = "Noctua had more to send at once than a connection carries, so it sent none of it."
"error.ipc.unread" = "The other side stopped taking what Noctua sent, so the connection to Noctua was closed. Try again."
"error.cli.command-line-unreadable" = "Noctua did not understand that command line, so it did nothing. Its help says what each command takes."
"error.cli.token-not-private" = "The file that proves this program belongs to Noctua could be reached by another account on this computer, so nothing was sent to Noctua."
"error.cli.token-unreadable" = "The file that proves this program belongs to Noctua is missing or damaged, so nothing was sent to Noctua. Start Noctua again and try once more."
"error.cli.daemon-misnamed" = "What answered is not this installation's Noctua, so nothing was sent to it."
"error.cli.answer-unreadable" = "Noctua answered with something this program does not understand. Install Noctua again so both are the same version."
"error.cli.output-failed" = "This program could not write its answer, so part of it may be missing."
"error.cli.daemon-did-not-start" = "Noctua was started and did not answer, so it may not be running. What it said as it ended, or what the system's service manager says of it, is shown beside this."
"error.cli.daemon-did-not-stop" = "Noctua was asked to stop and did not, so it may still be running. Try again in a moment."
"error.cli.process-unverified" = "Noctua did not answer, and the program its records name could not be shown to be Noctua, so nothing was stopped."
"error.cli.checkout-unknown" = "No development checkout with that digest is installed here, so nothing was chosen."
"error.cli.checkouts-unlisted" = "The development checkouts installed here could not be listed. Try again in a moment."
"error.cli.chosen-not-pointed" = "noctua-dev was not changed: its folder, or what is already there, is not this installation's to change, or it could not be written."
"error.cli.terminal-unanswered" = "The terminal did not answer, so nothing was chosen. Try again, or choose by the checkout's digest."
"error.cli.launcher-refused" = "This launcher's settings could belong to another account, or could not be read, so nothing was run. Install again."
"error.cli.input-failed" = "The MCP session's standard input could not be read, so the session ended."

