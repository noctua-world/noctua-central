"command.limits.prune.description" = "Remover os registros mais antigos de qualquer tabela que passou do limite."
"command.limits.prune.paragraph" = "Apaga os registros mais antigos de cada tabela do banco de dados deste aparelho que passou do limite declarado, ou só da tabela que você indicar. Um ensaio conta o que removeria e não remove nada. O que ele remove não pode ser recuperado, então desfazer para no passo que o executou."
"command.kernel.undo.title" = "Desfazer"
"command.kernel.undo.description" = "Desfazer o seu último passo: o que ele mudou no Noctua e os arquivos que criou."
"command.kernel.undo.paragraph" = "Encontra o seu passo mais recente que ainda pode ser desfeito e devolve cada valor que ele mudou e os arquivos que criou, depois de conferir de novo que você pode fazer cada coisa que ele fez. Para em um passo cujos efeitos saíram deste aparelho, e em um cujos valores mudaram desde então."
"command.kernel.redo.title" = "Refazer"
"command.kernel.redo.description" = "Fazer de novo o último passo que você desfez."
"command.kernel.redo.paragraph" = "Refaz o passo mais recente que você desfez, desde que você não tenha feito nada novo depois, conferindo de novo que você pode fazer cada coisa que ele fez. Um passo cujo desfazer precisou de correções próprias não pode ser refeito."

# --- Capabilities ---
"capability.context.description" = "Saber em nome de quem está agindo: a pessoa, quem age por ela e se uma pessoa confirmou este passo."
"capability.store.description" = "Guardar dados estruturados próprios, que nenhuma outra parte do Noctua consegue ler ou alterar."
"capability.blobs.read.description" = "Encontrar arquivos pelo conteúdo e lê-los, sem carregar um arquivo inteiro na memória."
"capability.blobs.write.description" = "Salvar arquivos novos e avisar outros dispositivos de que este os tem."
"capability.commands.dispatch.description" = "Pedir a outras partes do Noctua que executem seus comandos, cada um verificado como se uma pessoa tivesse pedido."
"capability.commands.begin.description" = "Agrupar várias alterações em um só passo, mantido inteiro ou descartado, e desfeito de uma vez."
"capability.events.publish.description" = "Anunciar que algo aconteceu, para outras partes do Noctua ficarem sabendo."
"capability.events.subscribe.description" = "Ficar sabendo dos anúncios que indica, e somente desses."
"capability.ui.description" = "Descrever o que mostra na tela, para o Noctua desenhar."
"capability.net.description" = "Acessar os sites que indica, e nenhum outro."
"capability.timers.description" = "Ser acordado depois de um tempo, ou em intervalos regulares."

