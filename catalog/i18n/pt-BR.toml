# --- Commands ---
"command.journal.verify.title" = "Verificar histórico de atividades"
"command.journal.verify.description" = "Conferir que toda ação registrada está intacta e em ordem."
"command.journal.verify.paragraph" = "Lê o histórico de atividades desde o início, ou desde a entrada que você indicar, e confere se cada ação registrada continua ligada à anterior. Não muda nada, e responde quantas entradas conferiu, ou a primeira que não confere e por quê."
"command.limits.prune.title" = "Limpar registros antigos"
"command.limits.prune.description" = "Remover os registros mais antigos de qualquer tabela que passou do limite."
"command.limits.prune.paragraph" = "Apaga os registros mais antigos de cada tabela do banco de dados deste aparelho que passou do limite declarado, ou só da tabela que você indicar. Um ensaio conta o que removeria e não remove nada. O que ele remove não pode ser recuperado, então desfazer para no passo que o executou."
"command.kernel.undo.title" = "Desfazer"
"command.kernel.undo.description" = "Desfazer o seu último passo: o que ele mudou no Noctua e os arquivos que criou."
"command.kernel.undo.paragraph" = "Encontra o seu passo mais recente que ainda pode ser desfeito e devolve cada valor que ele mudou e os arquivos que criou, depois de conferir de novo que você pode fazer cada coisa que ele fez. Para em um passo cujos efeitos saíram deste aparelho, e em um cujos valores mudaram desde então."
"command.kernel.redo.title" = "Refazer"
"command.kernel.redo.description" = "Fazer de novo o último passo que você desfez."
"command.kernel.redo.paragraph" = "Refaz o passo mais recente que você desfez, desde que você não tenha feito nada novo depois, conferindo de novo que você pode fazer cada coisa que ele fez. Um passo cujo desfazer precisou de correções próprias não pode ser refeito."
"command.naming.propose.title" = "Propor um nome de arquivo"
"command.naming.propose.description" = "Montar o nome de um arquivo com título, assinatura, palavras-chave e extensão."
"command.naming.propose.paragraph" = "Escreve o nome que o Noctua dá a um arquivo salvo: a assinatura, o título, as palavras-chave, o identificador e a extensão, cada um limpo do que um nome de arquivo não comporta. Um arquivo renomeado mantém o identificador que você informar e continua sendo o mesmo arquivo; sem ele, um identificador novo é criado. Não salva nada e não muda nada."
"command.naming.read.title" = "Ler um nome de arquivo"
"command.naming.read.description" = "Ler um nome de arquivo: identificador, assinatura, título e palavras-chave."
"command.naming.read.paragraph" = "Lê um nome escrito no esquema de nomes de arquivo do Noctua e responde o que ele contém: o identificador, a assinatura, o título, as palavras-chave e a extensão. Também diz se o nome já está escrito exatamente como o Noctua escreve, e dá a grafia que o Noctua usaria. Não muda nada."
"command.kernel.find.title" = "Encontrar um comando"
"command.kernel.find.description" = "Encontrar comandos pelas palavras do nome ou das etiquetas, nas duas línguas."
"command.kernel.find.paragraph" = "Procura, entre todos os comandos que o Noctua pode executar, os dele e os de cada plugin, aqueles cujos nomes e etiquetas, em inglês e em português, contêm cada palavra digitada, com as letras na ordem, sem distinguir acentos nem maiúsculas. Responde primeiro os melhores resultados, no máximo quantos você pedir, com onde cada palavra foi encontrada e quantos foram encontrados ao todo. Não muda nada."
"command.settings.mcp.read.title" = "Ver se o MCP está ligado"
"command.settings.mcp.read.description" = "Mostrar se esta instalação do Noctua deixa clientes MCP entrarem."
"command.settings.mcp.read.paragraph" = "Responde se o MCP está ligado nesta instalação do Noctua. Ele fica desligado até que uma pessoa o ligue, e ligá-lo aqui não o liga em nenhuma outra. Não muda nada."
"command.settings.mcp.set.title" = "Ligar ou desligar o MCP"
"command.settings.mcp.set.description" = "Deixar clientes MCP agirem aqui como agentes, ou impedi-los."
"command.settings.mcp.set.paragraph" = "Liga ou desliga o MCP nesta instalação do Noctua, e em nenhuma outra. Enquanto está desligado, nenhum cliente MCP entra; enquanto está ligado, um cliente age só como um agente que você criou e autorizou, nunca como você. Só você pode mudá-lo, pedindo diretamente, nunca de dentro de outra ação, e ligá-lo aguarda você confirmar na janela do Noctua. Desfazer o deixa como estava; quando isso o ligaria, o desfazer também aguarda você confirmar na janela do Noctua."
"command.settings.leader.read.title" = "Ver o Leader"
"command.settings.leader.read.description" = "Mostrar as teclas que chamam o Noctua de qualquer lugar."
"command.settings.leader.read.paragraph" = "Responde qual é o Leader em uso nesta instalação do Noctua: as teclas que mostram o Noctua de qualquer lugar do computador, escritas pela posição delas no teclado. Não muda nada."
"command.settings.leader.set.title" = "Mudar o Leader"
"command.settings.leader.set.description" = "Escolher as teclas que chamam o Noctua de qualquer lugar."
"command.settings.leader.set.paragraph" = "Muda o Leader desta instalação do Noctua, e de nenhuma outra. O Leader precisa de pelo menos uma entre Control, Alt, Shift e Super pressionada junto com a tecla dele, e é recusado quando conflitaria com a tecla acrescentada a ele ou com o Leader de outra instalação, ou quando o sistema não o entrega ao Noctua. Uma escolha recusada não muda nada. Só você pode mudá-lo, pedindo diretamente, nunca de dentro de outra ação. Desfazer para neste passo: para voltar, escolha o Leader que você tinha."
"command.settings.chord.read.title" = "Ver a tecla acrescentada"
"command.settings.chord.read.description" = "Mostrar a tecla pressionada com o Leader para mais atalhos."
"command.settings.chord.read.paragraph" = "Responde qual tecla, pressionada junto com o Leader, alcança um segundo conjunto de atalhos nesta instalação do Noctua. É Shift até você escolher outra. Não muda nada."
"command.settings.chord.set.title" = "Mudar a tecla acrescentada"
"command.settings.chord.set.description" = "Escolher a tecla pressionada com o Leader para mais atalhos."
"command.settings.chord.set.paragraph" = "Muda a tecla que, pressionada junto com o Leader, alcança um segundo conjunto de atalhos, nesta instalação do Noctua e em nenhuma outra: uma entre Control, Alt, Shift e Super. É recusada quando o Leader já a inclui, ou quando o Leader com ela seria o Leader de outra instalação. Uma escolha recusada não muda nada. Só você pode mudá-la, pedindo diretamente, nunca de dentro de outra ação. Desfazer para neste passo: para voltar, escolha a tecla que você tinha."
"command.settings.menu-keys.read.title" = "Ver as teclas do menu do Leader"
"command.settings.menu-keys.read.description" = "Mostrar cada tecla do menu do Leader e o que ela executa."
"command.settings.menu-keys.read.paragraph" = "Responde todas as teclas do menu do Leader em uso nesta instalação do Noctua, cada uma ao lado do comando que executa: as teclas do próprio Noctua, com as suas escolhas por cima. Não muda nada."
"command.settings.menu-keys.set.title" = "Mudar as teclas do menu do Leader"
"command.settings.menu-keys.set.description" = "Escolher cada tecla do menu do Leader e o que ela executa."
"command.settings.menu-keys.set.paragraph" = "Substitui todas as teclas do menu do Leader nesta instalação do Noctua, e em nenhuma outra, pelas teclas que você informar, cada uma ao lado do comando que executa. Um comando que você deixar de fora não aparece no menu. Uma tecla executa um comando só, então uma tecla informada duas vezes é recusada, e uma escolha recusada não muda nada. Só você pode mudá-las, pedindo diretamente, nunca de dentro de outra ação. Desfazer para neste passo: para voltar, informe as teclas que você tinha."
"command.settings.chords.read.title" = "Ver as combinações"
"command.settings.chords.read.description" = "Mostrar cada tecla pressionada com o Leader e o que ela executa."
"command.settings.chords.read.paragraph" = "Responde todas as teclas que agem enquanto o Leader está pressionado nesta instalação do Noctua, cada uma ao lado do comando que executa e se a tecla acrescentada também é pressionada: as teclas do próprio Noctua, com as suas escolhas por cima. Não muda nada."
"command.settings.chords.set.title" = "Mudar as combinações"
"command.settings.chords.set.description" = "Escolher cada tecla pressionada com o Leader e o que ela executa."
"command.settings.chords.set.paragraph" = "Substitui todas as teclas que agem enquanto o Leader está pressionado nesta instalação do Noctua, e em nenhuma outra, pelas teclas que você informar, cada uma ao lado do comando que executa e se a tecla acrescentada também é pressionada. Um comando que você deixar de fora fica sem combinação. Uma tecla executa um comando só, então uma tecla informada duas vezes do mesmo jeito é recusada, e uma escolha recusada não muda nada. Só você pode mudá-las, pedindo diretamente, nunca de dentro de outra ação. Desfazer para neste passo: para voltar, informe as teclas que você tinha."
"command.agents.create.title" = "Criar um agente"
"command.agents.create.description" = "Criar um agente que age por você, com um orçamento próprio."
"command.agents.create.paragraph" = "Cria um novo agente seu: uma identidade própria, com a qual um cliente MCP age só por você. Você lhe dá um nome e um orçamento, que cada sessão dele gasta uma unidade por vez, e ele não pode fazer nada até que você lhe dê acesso a um recurso. Só você pode criar um, pedindo diretamente, nunca de dentro de outra ação. Um agente nunca é apagado, então desfazer para no passo que o criou."
"command.agents.list.title" = "Listar seus agentes"
"command.agents.list.description" = "Mostrar os agentes que você criou, cada um com o que lhe deu e até quando."
"command.agents.list.paragraph" = "Responde cada agente que você criou, na ordem em que os criou, com o nome, o orçamento e cada permissão que você lhe deu e não encerrou, mesmo a que já venceu: o recurso, o motivo e de quando até quando. Não muda nada."
"command.agents.grant.title" = "Dar a um agente acesso a um recurso"
"command.agents.grant.description" = "Deixar um agente seu usar um recurso, por um motivo e um prazo que você dá."
"command.agents.grant.paragraph" = "Deixa um agente seu, indicado pelo identificador que o Noctua lhe deu, usar um recurso por quantos minutos você disser, até o prazo mais longo que uma permissão pode ter, e guarda o motivo. Uma nova permissão no mesmo recurso encerra a anterior, e o agente continua fazendo só o que você mesmo pode fazer. Só você pode dar a permissão, pedindo diretamente, nunca de dentro de outra ação. Para retirá-la, revogue: desfazer para numa permissão dada."
"command.agents.revoke.title" = "Revogar o acesso de um agente"
"command.agents.revoke.description" = "Encerrar o que você deu a um agente seu: um recurso, ou todos."
"command.agents.revoke.paragraph" = "Encerra a permissão que um agente seu tem no recurso que você indicar, ou todas as que ele tem se você não indicar nenhum, a partir da próxima ação dele. O agente continua guardado, com o orçamento, para você lhe dar acesso de novo. Só você pode revogar, pedindo diretamente, nunca de dentro de outra ação, e desfazer para numa revogação."
"command.shell.read.title" = "Ler o estado da interface"
"command.shell.read.description" = "Mostrar tudo o que a interface guarda: janelas, páginas, gaveta e prompt."
"command.shell.read.paragraph" = "Responde o estado completo da interface como o Noctua o guarda: cada janela e as páginas abertas nela, a gaveta, a barra lateral, o rodapé, a linha de informações, o prompt e onde cada assento está, com a revisão em que está. Pedido de dentro de um comando que mudou a interface, responde essa mudança, que só é do Noctua quando o comando termina, e sem revisão. Não altera nada."
"command.shell.focus.title" = "Mover o foco de um assento"
"command.shell.focus.description" = "Levar o teclado de um assento para uma parte de uma janela da interface."
"command.shell.focus.paragraph" = "Move o foco do teclado de um assento — o do próprio sistema, a menos que você indique outro — para uma parte de uma janela: a área de trabalho, a gaveta, a linha do prompt, a barra lateral, a linha de informações ou a linha de modo. Todas as janelas da interface acompanham. Um teclado numa gaveta que não mostra nada aberto volta para a linha do prompt, seja qual for o comando que a deixou assim."
"command.shell.hover.title" = "Dizer para onde um assento aponta"
"command.shell.hover.description" = "Registrar o que está sob o ponteiro de um assento, ou a seleção do teclado dele."
"command.shell.hover.paragraph" = "Registra o que está sob o ponteiro de um assento, ou onde está a seleção do teclado dele, para que a linha de informações diga o que é; sem indicar nada, limpa o registro. A linha de informações mostra o que mudou por último entre os dois."
"command.shell.drag.title" = "Dizer o que um assento arrasta"
"command.shell.drag.description" = "Registrar o que um assento está arrastando, ou que parou de arrastar."
"command.shell.drag.paragraph" = "Registra o que um assento está arrastando na interface, para que todas as janelas mostrem isso sendo arrastado; sem indicar nada, diz que o arraste terminou."
"command.window.open.title" = "Abrir outra janela"
"command.window.open.description" = "Abrir mais uma janela da interface, mostrando o mesmo estado."
"command.window.open.paragraph" = "Abre mais uma janela da interface, já visível. Todas as janelas mostram a mesma gaveta, o mesmo prompt e o mesmo rodapé, e cada uma tem a sua própria pilha de páginas. A interface comporta um número limitado de janelas."
"command.window.show.title" = "Mostrar uma janela"
"command.window.show.description" = "Mostrar uma janela da interface que está escondida."
"command.window.show.paragraph" = "Mostra uma janela da interface — a que você está usando, a menos que indique outra — exatamente como estava quando foi escondida."
"command.window.hide.title" = "Esconder uma janela"
"command.window.hide.description" = "Esconder uma janela da interface, mantendo tudo o que há nela."
"command.window.hide.paragraph" = "Esconde uma janela da interface — a que você está usando, a menos que indique outra. Nada para: o que estava aberto nela é mantido, e mostrá-la de novo traz tudo de volta."
"command.window.close.title" = "Fechar uma janela"
"command.window.close.description" = "Fechar uma janela da interface, ou escondê-la quando for a última."
"command.window.close.paragraph" = "Fecha uma janela da interface — a que você está usando, a menos que indique outra — com as páginas que só ela mostrava. A última janela é escondida em vez de fechada, para que a interface esteja sempre pronta para aparecer. Nada do que roda no Noctua para."
"command.window.move.title" = "Mover uma janela"
"command.window.move.description" = "Colocar uma janela da interface numa posição da tela."
"command.window.move.paragraph" = "Move uma janela da interface — a que você está usando, a menos que indique outra — para que o canto superior esquerdo fique na posição indicada, nas unidades da própria tela. Num gerenciador de janelas em mosaico, ele pode colocá-la em outro lugar."
"command.window.resize.title" = "Redimensionar uma janela"
"command.window.resize.description" = "Dar a uma janela da interface uma nova largura e uma nova altura."
"command.window.resize.paragraph" = "Redimensiona uma janela da interface — a que você está usando, a menos que indique outra — em pixels CSS. Uma janela nunca fica menor que o menor tamanho para o qual todas as páginas são feitas."
"command.leader.tap.title" = "Tocar a tecla Leader"
"command.leader.tap.description" = "Fazer o que um toque da tecla Leader faz na interface."
"command.leader.tap.paragraph" = "Faz o que um toque da tecla Leader faz: mostra a interface e o rodapé e leva o teclado para a linha do prompt; tocada de novo ali, abre o menu do Leader na gaveta; e tocada com o menu aberto numa janela à vista, manda a próxima página aberta para a outra região — a gaveta em vez da área de trabalho, ou o contrário."
"command.confirmations.list.title" = "Listar o que aguarda confirmação"
"command.confirmations.list.description" = "Mostrar cada chamada que aguarda uma pessoa confirmá-la na janela do Noctua."
"command.confirmations.list.paragraph" = "Lista cada chamada que o Noctua segura até que uma pessoa a confirme na janela do Noctua — uma que não pode ser desfeita, ou uma que liga o MCP: seu número, o comando, se pode ser desfeita, a pessoa cuja confirmação ela aguarda e o agente que a pediu, quando foi um agente, e quando a espera termina. Só a janela do Noctua pode confirmar ou recusar uma delas; este comando apenas as mostra e não altera nada."
"command.confirmations.read.title" = "Ler o que aguarda confirmação"
"command.confirmations.read.description" = "Mostrar uma chamada que aguarda confirmação, com os argumentos com que rodaria."
"command.confirmations.read.paragraph" = "Mostra a chamada que o Noctua segura sob o número dado até que uma pessoa a confirme na janela do Noctua: o comando, os argumentos com que rodaria, a pessoa cuja confirmação ela aguarda, o agente que a pediu, quando foi um agente, e quando a espera termina. Um número sob o qual nada mais aguarda é recusado. Não altera nada."
"command.surfaces.list.title" = "Listar as superfícies abertas"
"command.surfaces.list.description" = "Mostrar as superfícies abertas pelos plugins e quem desenhou cada uma."
"command.surfaces.list.paragraph" = "Lista cada superfície que os plugins mantêm abertas: seu nome, onde aparece, seu título, o plugin que a mantém e quem desenhou o que ela mostra agora — a pessoa por quem o plugin agiu e o agente que agiu por ela, quando foi um agente. Não mostra o conteúdo de cada superfície; leia uma superfície para isso. Não altera nada."
"command.surfaces.read.title" = "Ler uma superfície"
"command.surfaces.read.description" = "Mostrar uma superfície aberta, com o que ela mostra e quem o desenhou."
"command.surfaces.read.paragraph" = "Mostra a superfície indicada: onde aparece, seu título, o plugin que a mantém, tudo o que ela mostra agora e quem desenhou isso — a pessoa por quem o plugin agiu e o agente que agiu por ela, quando foi um agente. Uma superfície que não está mais aberta é recusada. Não altera nada."
"command.surfaces.activate.title" = "Acionar algo em uma superfície"
"command.surfaces.activate.description" = "Executar o que um botão ou chave de uma superfície executa, como um clique."
"command.surfaces.activate.paragraph" = "Faz o que clicar em um botão ou chave de uma superfície faz: executa a ação que a própria superfície indica, com o que você digitou nos campos que ela usa, e nada que você mesmo indique. Algo desenhado por um agente nunca é executado assim, pois rodaria com a sua autoridade. O que ele executa é decidido e registrado como si mesmo, e desfazer o trata como um passo daquele comando."
"command.kernel.history.title" = "Mostrar o próximo desfazer"
"command.kernel.history.description" = "Dizer qual passo o seu próximo desfazer desfaz, e se um agente o deu."
"command.kernel.history.paragraph" = "Mostra o passo que o seu próximo desfazer desfaria: seu nome, quando foi dado, se o desfazer para ali e o agente que o deu, quando foi um dos seus agentes — os passos de um agente são seus para desfazer, como os seus. Não altera nada."
"command.page.open.title" = "Abrir uma página"
"command.page.open.description" = "Abrir uma página: configurações, ajuda, dev, uma superfície ou uma lista."
"command.page.open.paragraph" = "Abre uma página na área de trabalho de uma janela ou na gaveta — onde a direção da gaveta indicar, a menos que você escolha. Uma página que já está aberta aparece de novo onde for pedida, como mais uma vista da mesma página. Abrir uma página fecha o menu do Leader."
"command.page.settings.title" = "Abrir as configurações"
"command.page.settings.description" = "Abrir as configurações, onde a direção do menu do Leader indicar."
"command.page.settings.paragraph" = "Abre a lista de configurações, como Leader s faz: na área de trabalho, ou na gaveta quando a direção do menu do Leader aponta para lá ou um toque no Leader a inverteu para esta página. Se as configurações já estão abertas, aparecem de novo ali."
"command.page.help.title" = "Abrir a ajuda"
"command.page.help.description" = "Abrir as páginas de ajuda, onde a direção do menu do Leader indicar."
"command.page.help.paragraph" = "Abre a lista de páginas de ajuda, como Leader h faz: na área de trabalho, ou na gaveta quando a direção do menu do Leader aponta para lá ou um toque no Leader a inverteu para esta página. Se a ajuda já está aberta, aparece de novo ali."
"command.page.dev.title" = "Abrir as páginas de dev"
"command.page.dev.description" = "Abrir as páginas para desenvolver e operar o Noctua."
"command.page.dev.paragraph" = "Abre a lista de páginas de dev, como Leader d faz: na área de trabalho, ou na gaveta quando a direção do menu do Leader aponta para lá ou um toque no Leader a inverteu para esta página. Cada página de dev é autorizada como qualquer comando."
"command.page.shortcuts.title" = "Abrir os atalhos da página"
"command.page.shortcuts.description" = "Abrir na gaveta os atalhos da página em foco."
"command.page.shortcuts.paragraph" = "Abre, na gaveta, a lista dos atalhos que a página em foco guarda para si, como Leader / faz. Uma página guarda ali os seus próprios atalhos, e não nos atalhos globais."
"command.page.actions.title" = "Abrir as ações da janela"
"command.page.actions.description" = "Abrir na gaveta as ações sobre a janela e a página em foco."
"command.page.actions.paragraph" = "Abre, na gaveta, a lista do que se pode fazer com a janela — escondê-la, fechá-la, movê-la, redimensioná-la — como Leader w faz. Escolher uma a executa, pedindo na linha de comando o que ela precisar."
"command.page.close.title" = "Fechar uma página"
"command.page.close.description" = "Fechar uma página da interface, num lugar ou em todos os lugares onde aparece."
"command.page.close.paragraph" = "Fecha a página em foco na área de trabalho de uma janela ou na gaveta, ou a página que você indicar — do lugar que você disser, ou de todos os lugares onde aparece. Uma página que nada mais mostra é fechada de vez; o que ela começou continua rodando."
"command.page.focus.title" = "Trazer uma página para a frente"
"command.page.focus.description" = "Mostrar uma página aberta, na área de trabalho ou na gaveta."
"command.page.focus.paragraph" = "Traz para a frente uma página que já está aberta, no lugar que a mostra: a área de trabalho de uma janela, ou a gaveta, que é expandida se estava recolhida."
"command.page.next.title" = "Mostrar a próxima página"
"command.page.next.description" = "Trazer para a frente a próxima página da pilha de uma janela."
"command.page.next.paragraph" = "Traz para a frente a página que vem depois da que está em foco na área de trabalho de uma janela. Na última página, nada muda."
"command.page.previous.title" = "Mostrar a página anterior"
"command.page.previous.description" = "Trazer para a frente a página anterior da pilha de uma janela."
"command.page.previous.paragraph" = "Traz para a frente a página que vem antes da que está em foco na área de trabalho de uma janela. Na primeira página, nada muda."
"command.page.into.title" = "Entrar numa subpágina"
"command.page.into.description" = "Abrir uma subpágina dentro de uma página, como um tópico da ajuda."
"command.page.into.paragraph" = "Avança um passo para dentro de uma página — a que está em foco, a menos que você indique outra — até o tópico indicado, para que voltar retorne a onde estava. Uma página só desce um número limitado de passos."
"command.page.back.title" = "Voltar dentro de uma página"
"command.page.back.description" = "Sair de uma subpágina e voltar para a página de onde ela foi aberta."
"command.page.back.paragraph" = "Volta um passo dentro de uma página — a que está em foco, a menos que você indique outra. Uma página que não está numa subpágina fica como está."
"command.page.scroll.title" = "Rolar uma página"
"command.page.scroll.description" = "Definir até onde uma página está rolada, para que reabra onde estava."
"command.page.scroll.paragraph" = "Define até onde uma página está rolada para baixo, em pixels CSS — a página em foco, a menos que você indique outra — para que todas as janelas a mostrem ali e reabri-la leve você de volta ao mesmo ponto."
"command.drawer.collapse.title" = "Recolher a gaveta"
"command.drawer.collapse.description" = "Esconder a gaveta inteira, mantendo abertas todas as páginas dela."
"command.drawer.collapse.paragraph" = "Esconde a gaveta abaixo do rodapé, mantendo abertas as páginas que há nela; o fim da linha de modo passa a mostrar quantas são. Expandi-la traz tudo de volta."
"command.drawer.expand.title" = "Expandir a gaveta"
"command.drawer.expand.description" = "Mostrar a gaveta de novo, com tudo o que estava aberto nela."
"command.drawer.expand.paragraph" = "Mostra de novo a gaveta abaixo do rodapé, como estava quando foi recolhida."
"command.drawer.back.title" = "Voltar na gaveta"
"command.drawer.back.description" = "Sair de uma subpágina da página da gaveta, ou fechar a página se não houver."
"command.drawer.back.paragraph" = "Faz o que o Esc faz na gaveta: volta um passo dentro da página em foco na gaveta ou, quando essa página não está numa subpágina, fecha-a na gaveta; um assento cujo teclado estava numa gaveta que fica sem mostrar nada volta para a linha do prompt."
"command.drawer.toward.title" = "Escolher onde as páginas abrem"
"command.drawer.toward.description" = "Abrir as páginas do menu do Leader na área de trabalho ou na gaveta."
"command.drawer.toward.paragraph" = "Escolhe para onde vai uma página aberta pelo menu do Leader: a área de trabalho, para onde elas vão no início, ou a gaveta. A escolha fica guardada até você mudá-la."
"command.drawer.resize.title" = "Redimensionar a gaveta"
"command.drawer.resize.description" = "Definir quanto da altura a gaveta ocupa, sempre menos da metade."
"command.drawer.resize.paragraph" = "Define quanto da altura que a gaveta divide com a área de trabalho ela ocupa, em porcentagem. Ela sempre fica mais baixa que a área de trabalho."
"command.sidebar.show.title" = "Mostrar a barra lateral"
"command.sidebar.show.description" = "Mostrar a lista do que está aberto na interface."
"command.sidebar.show.paragraph" = "Mostra a barra lateral, a lista de tudo o que está aberto na interface."
"command.sidebar.hide.title" = "Esconder a barra lateral"
"command.sidebar.hide.description" = "Esconder a lista do que está aberto na interface."
"command.sidebar.hide.paragraph" = "Esconde a barra lateral; um assento cujo teclado estava nela volta para a área de trabalho."
"command.sidebar.cycle.title" = "Mostrar, focar ou esconder a barra"
"command.sidebar.cycle.description" = "Fazer o que Leader Espaço faz: mostrar a barra lateral, focá-la ou escondê-la."
"command.sidebar.cycle.paragraph" = "Mostra a barra lateral quando está escondida, leva o teclado de um assento até ela quando está visível, e a esconde quando o teclado já está nela."
"command.footer.show.title" = "Mostrar o rodapé"
"command.footer.show.description" = "Mostrar agora as três linhas do rodapé, mesmo onde a configuração o esconde."
"command.footer.show.paragraph" = "Mostra agora as três linhas do rodapé. Onde o rodapé está configurado para se esconder, ele fica até que nada mais o segure ali."
"command.footer.hide.title" = "Esconder o rodapé"
"command.footer.hide.description" = "Deixar o rodapé se esconder de novo onde a configuração o esconde."
"command.footer.hide.paragraph" = "Deixa o rodapé se esconder de novo onde ele está configurado para isso. Onde está configurado para aparecer sempre, ele fica."
"command.info.say.title" = "Dizer algo na linha de informações"
"command.info.say.description" = "Mostrar uma mensagem curta na linha de informações até que seja limpa."
"command.info.say.paragraph" = "Mostra uma mensagem na linha de informações, a linha do meio do rodapé, no lugar da anterior."
"command.info.clear.title" = "Limpar a linha de informações"
"command.info.clear.description" = "Tirar a mensagem da linha de informações."
"command.info.clear.paragraph" = "Tira a mensagem da linha de informações, que volta a dizer onde cada assento está."
"command.info.expand.title" = "Expandir a linha de informações"
"command.info.expand.description" = "Deixar a linha de informações crescer para mostrar tudo o que tem."
"command.info.expand.paragraph" = "Deixa a linha de informações quebrar e crescer para mostrar tudo o que tem, com o que está sob o ponteiro e onde está o teclado, cada um numa linha própria."
"command.info.collapse.title" = "Recolher a linha de informações"
"command.info.collapse.description" = "Manter a linha de informações numa linha só de novo."
"command.info.collapse.paragraph" = "Mantém a linha de informações numa linha só de novo, cortando o que não couber."
"command.prompt.set.title" = "Digitar na linha do prompt"
"command.prompt.set.description" = "Definir o que a linha do prompt contém, como se fosse digitado ali."
"command.prompt.set.paragraph" = "Define o texto da linha do prompt, a última linha do rodapé. Um texto que começa com ponto e vírgula ou dois-pontos abre a lista de comandos na gaveta, e o resto dele filtra a lista."
"command.prompt.ask.title" = "Pedir os parâmetros de um comando"
"command.prompt.ask.description" = "Manter a linha do prompt num comando, pedindo os parâmetros dele."
"command.prompt.ask.paragraph" = "Mantém a linha do prompt no comando que você escolheu, oferecendo os parâmetros dele — no que você indicar, quando indicar um — para que o que você digitar em seguida seja o valor de um parâmetro."
"command.prompt.clear.title" = "Limpar a linha do prompt"
"command.prompt.clear.description" = "Esvaziar a linha do prompt e parar de pedir qualquer coisa."
"command.prompt.clear.paragraph" = "Esvazia a linha do prompt e para de pedir um comando ou os parâmetros dele, fechando a lista de comandos na gaveta."

# --- Capabilities ---
"capability.context.description" = "Saber em nome de quem está agindo: a pessoa, quem age por ela e se uma pessoa confirmou este passo."
"capability.store.description" = "Guardar dados estruturados próprios, que nenhuma outra parte do Noctua consegue ler ou alterar."
"capability.blobs.read.description" = "Encontrar arquivos pelo conteúdo e lê-los, sem carregar um arquivo inteiro na memória."
"capability.blobs.write.description" = "Salvar arquivos novos e avisar outros dispositivos de que este os tem."
"capability.commands.dispatch.description" = "Pedir a outras partes do Noctua que executem seus comandos, cada um verificado como se uma pessoa tivesse pedido."
"capability.commands.begin.description" = "Agrupar várias alterações em um só passo, mantido inteiro ou descartado, e desfeito de uma vez."
"capability.events.publish.description" = "Anunciar que algo aconteceu, para outras partes do Noctua ficarem sabendo."
"capability.events.subscribe.description" = "Ficar sabendo dos anúncios que indica, e somente desses."
"capability.ui.description" = "Descrever o que mostra na tela, para o Noctua desenhar."
"capability.net.description" = "Acessar os sites que indica, e nenhum outro."
"capability.timers.description" = "Ser acordado depois de um tempo, ou em intervalos regulares."

