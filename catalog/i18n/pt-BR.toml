# Brazilian Portuguese.
#
# The **values** in this file are the only text in this repository written in
# another language. Everything else — these comments, the keys, and all the code
# around them — is English, always (`NOCTUA.md §2.1`). A comment in Portuguese
# here would be the rule broken inside the one file that documents it.
#
# Every key in `en.toml` exists here and every key here exists there, in
# `[message]` and in `[tags]` alike: one missing from either side **fails the
# build**, naming the entry and the text it is. The `{placeholders}` of
# each message must be exactly the ones `en.toml` uses — a placeholder the caller
# does not supply is rendered literally, so the reader sees the braces.
#
# The sentences are written for somebody who does not know the system: what
# happened, and what they can do. No error code in the text.

[meta]
name  = "Português do Brasil"
bcp47 = "pt-BR"
dir   = "ltr"

# The words a search finds each entry by, one list per entry, in this locale's
# own words — see the same table in `en.toml`.
[tags]

# --- Commands ---
"command.journal.verify.tags" = ["verificar", "conferir", "histórico", "atividade", "integridade", "auditoria"]
"command.limits.prune.tags" = ["limpar", "apagar", "registros antigos", "limite", "liberar espaço"]
"command.kernel.undo.tags" = ["desfazer", "voltar atrás", "reverter", "anular"]
"command.kernel.redo.tags" = ["refazer", "fazer de novo", "repetir", "restaurar"]

[message]

