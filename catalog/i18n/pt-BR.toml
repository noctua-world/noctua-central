"category-set.freedesktop.title" = "Categorias de menu do freedesktop"
"category-set.freedesktop.description" = "As categorias da especificação de menus do freedesktop.org"
"category-set.apple.title" = "Categorias de apps da Apple"
"category-set.apple.description" = "As categorias que um app da Apple declara em LSApplicationCategoryType"
"category-set.noctua.title" = "Categorias do Noctua"
"category-set.noctua.description" = "As categorias da própria plataforma, para os seus comandos"
"category.freedesktop.audio-video.title" = "Áudio e vídeo"
"category.freedesktop.audio-video.description" = "Aplicativo para apresentar, criar ou processar multimídia (áudio e vídeo)"
"category.freedesktop.audio.title" = "Áudio"
"category.freedesktop.audio.description" = "Um aplicativo de áudio"
"category.freedesktop.video.title" = "Vídeo"
"category.freedesktop.video.description" = "Um aplicativo de vídeo"
