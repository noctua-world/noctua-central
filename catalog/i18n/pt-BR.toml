"external-identifier.chromium.title" = "Chromium"
"external-identifier.chromium.description" = "Navegador da web de código aberto"
"external-identifier.chromium.paragraph" = "O projeto de navegador da web de código aberto. As distribuições de cada sistema o empacotam com nomes próprios, por isso esta entrada só nomeia o que foi medido em um sistema ou está escrito nas fontes do próprio projeto: os comandos que o iniciam no Linux, o identificador e o executável do pacote no macOS, e o executável no Windows."
