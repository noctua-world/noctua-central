# The surfaces plugins show (`NOCTUA.md §11.6`): what the kernel keeps of each
# — its title, the plugin that holds it, the last tree it was given and who
# rendered that tree, the person a call tree acted for and the agent whose
# session acted for them when one did. `surfaces.list` and `surfaces.read` are
# reads on `Feature::"interface"`, as the interface's own commands are.
# `surfaces.activate` is what a click or a submit is: the node is named by the
# JSON pointer a refusal of the tree names it by, and the command it runs and
# its arguments are read from the tree the kernel kept, never from the caller,
# who gives only the text typed into each input the node binds. A tree an
# agent's call tree rendered is never activated (`[NC-KERN-0035]`). It is
# `Write`, and changes state only through the command it dispatches — nested,
# decided and journaled as itself, a step of its own when it changes state — so
# it opens no unit and is no step of its own.
#
# The bounds: a surface's identifier at most 64 characters, a node's pointer at
# most 512 — the pointer to the deepest node a tree may hold fits — an input's
# name at most 64 characters, as a tree names an input, what is typed into one
# at most `[kernel] ui_text_bytes`, and at most `ui_tree_nodes` inputs; each held
# equal to its source by a test beside the commands.
[[command]]
name = "surfaces.list"
title = "command.surfaces.list.title"
description = "command.surfaces.list.description"
paragraph = "command.surfaces.list.paragraph"
tags = "command.surfaces.list.tags"
action = "Read"
resource_selector = "feature:interface"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{},"additionalProperties":false}"""

[[command]]
name = "surfaces.read"
title = "command.surfaces.read.title"
description = "command.surfaces.read.description"
paragraph = "command.surfaces.read.paragraph"
tags = "command.surfaces.read.tags"
action = "Read"
resource_selector = "feature:interface"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{"surface":{"type":"string","minLength":1,"maxLength":64}},"required":["surface"],"additionalProperties":false}"""

[[command]]
name = "surfaces.activate"
title = "command.surfaces.activate.title"
description = "command.surfaces.activate.description"
paragraph = "command.surfaces.activate.paragraph"
tags = "command.surfaces.activate.tags"
action = "Write"
