# Command metadata and keybindings (`NOCTUA.md §11.4`, `§12.8`).
#
# Commands are the only way to mutate state, so this file is also the platform's
# tool surface: every command declares a JSON Schema for its arguments, and that
# schema is what exposes it to an AI agent. **There is no separate "tools and
# skills" subsystem** — do not build one (`§11.4`).
#
# The schema is written in the closed subset `crates/nc-schema` validates, and
# the build holds every entry here to the same judge the kernel holds a
# plugin's command to at `activate`: a keyword outside the subset fails the
# build rather than being ignored, and every object says
# `"additionalProperties": false`.
#
# What a person is shown of a command is its entry (`§20.4`): four keys into
# `catalog/i18n/`, each required and resolved in every locale, and three
# optional fields. Every text is held to `nc_schema::entry`, the judge the kernel
# holds a plugin's entries to as well, and a locale's texts together to
# `[kernel] entry_bytes`, the bound a plugin's are held to:
#
#   title              the display name, at most 64 characters
#   description        the line description, one line of at most 80 characters
#   paragraph          a paragraph saying more, at most 1,024 characters, and
#                      never the line again
#   tags               the key of a list under `[tags]`: at least one word a
#                      search finds the command by, at most 32 of at most 40
#                      characters each, none twice, and none holding a comma
#                      or a brace, so no tag holds a placeholder either
#   categories         optional: the names of the categories it is listed under,
#                      at most four, none twice, each one `catalog/categories.toml`
#                      holds — the kernel's own are the `noctua` set's
#   glyph              optional: the code point it is shown with, written
#                      `U+` and upper-case hex, four digits at least and no
#                      leading zero past them — `U+F0E2`, never `U+0F0E2` —
#                      one the Symbols-Only font draws, the icon's name in a
#                      comment beside it
#
# A wiki text, optional, is not a field: it is found at
# `catalog/wiki/<locale>/commands/<name>.<md|txt|typ>`, in every locale and in
# one format.
#
# Keybindings, optional, are a list, `keybindings = [...]`, each in the Leader's
# grammar (`§12.8`), the one `nc_schema::keys` holds every reader of a binding
# to: `Leader <key>` for a key in the leader menu,
# `Leader+<key>` for one pressed with the Leader held, and `Leader+Chord+<key>`
# for one pressed with the chord modifier held as well, the key named as
# `KeyboardEvent.code` names it — `Leader+Chord+KeyQ`. Any other spelling fails
# the build, and so does one key of one table bound twice; the same key in two
# tables is two bindings. None is written here: the catalog's bindings arrive
# with the layer that binds them (`§15.2`). They are the defaults: a person's
# own configuration replaces a command's list in their channel, and
# `nc_channel::keys` judges it by the same grammar.
#
# Four fields are required and none of them is optional at `activate`
# (`§11.7`, `reference/identity-and-authorization.md §2`):
#
#   action             the Cedar action name the PDP evaluates
#   resource_selector  how the kernel extracts the resource from the arguments:
#                      `realm`; `argument:<name>` naming a required string
#                      argument whose schema carries `x-entity` — the Cedar type
#                      it identifies — and a `maxLength` of at most 128; or
#                      `feature:<id>`, a feature of the platform the realm's
#                      directory holds, for a command of the kernel's own that
#                      reads none of the realm's data — a plugin is refused it
#   reversibility      read | write | irreversible
#   mutating           whether it changes state at all
#
# `irreversible` requires `confirmed_by_human` in the context, and that flag is
# **issued by the kernel from real UI interaction — never an argument an agent
# can fill in** (`§14.6`). The decision point holds it after Cedar allows the
# command, refusing one no confirmation the kernel issued for it was redeemed
# with (`§11.7`).
#
# The commands below are the kernel's own operations: verifying the journal's
# chain, pruning a table that has passed its limit, stepping back and forward
# through a person's own history, proposing and reading a file's name, finding
# a command by any word of its names and tags, reading and switching a setting
# of the channel, and making, listing, granting and ending what a person's
# agents may do. The
# kernel registers every one as its own — a command in the namespaces it keeps,
# `agents.`, `kernel.`, `journal.`, `limits.`, `naming.` and `settings.`, is the
# kernel's — decides each at its decision point as it decides
# a plugin's, and runs each one it allows itself: every command here has a
# handler in `crates/nc-kernel/src/builtin.rs`, and that file's test holds the
# two lists to each other both ways. A plugin's commands are not written here:
# a plugin declares them at `activate`, and the kernel holds each to the same
# judge. A command written here outside the namespaces the kernel keeps would be
# one the catalog describes for a plugin to implement, registered only when a
# plugin declares it matching this entry in every field a dispatch is decided
# by (`NOCTUA.md §15.2`).

[[command]]
name = "journal.verify"
title = "command.journal.verify.title"
description = "command.journal.verify.description"
paragraph = "command.journal.verify.paragraph"
tags = "command.journal.verify.tags"
categories = ["noctua.history"]
glyph = "U+F058"   # nf-fa-check_circle
action = "Read"
resource_selector = "realm"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{"from":{"type":"integer","minimum":0}},"additionalProperties":false}"""

[[command]]
name = "limits.prune"
title = "command.limits.prune.title"
description = "command.limits.prune.description"
paragraph = "command.limits.prune.paragraph"
tags = "command.limits.prune.tags"
categories = ["noctua.maintenance"]
glyph = "U+F1F8"   # nf-fa-trash
action = "Delete"
resource_selector = "realm"
# `write` and not `irreversible`, and the distinction is the point: what this
# deletes is already past its declared limit, so the rows it removes were
# promised to nobody. An `irreversible` command is one whose effect a human must
# confirm each time, and a scheduled pruner cannot ask. `write` is not a promise
# of undo either: a step that pruned is one undo stops at, and
# `docs/commands.md` answers so for this command.
reversibility = "write"
mutating = true
args_schema = """
{"type":"object","properties":{"table":{"type":"string"},"dry_run":{"type":"boolean"}},"additionalProperties":false}"""

# Undo and redo are a person's own: the resource is the realm, the action is
# `Write`, and `family.a_member_steps_through_their_own_history` is what permits
# it — the step undone is always the newest of the principal who asks, and what
# it changed is authorized again now, one decision for each thing it changed.
# **No argument.** Which step is the kernel's to find, so no identifier crosses
# this boundary; and both run only at the top of a call tree, never from inside
# another command (`[NC-KERN-0017]`).
[[command]]
name = "kernel.undo"
title = "command.kernel.undo.title"
description = "command.kernel.undo.description"
paragraph = "command.kernel.undo.paragraph"
tags = "command.kernel.undo.tags"
categories = ["noctua.history"]
glyph = "U+F0E2"   # nf-fa-undo
action = "Write"
resource_selector = "realm"
reversibility = "write"
mutating = true
args_schema = """
{"type":"object","properties":{},"additionalProperties":false}"""

[[command]]
name = "kernel.redo"
title = "command.kernel.redo.title"
description = "command.kernel.redo.description"
paragraph = "command.kernel.redo.paragraph"
tags = "command.kernel.redo.tags"
categories = ["noctua.history"]
glyph = "U+F01E"   # nf-fa-repeat
action = "Write"
resource_selector = "realm"
reversibility = "write"
mutating = true
args_schema = """
{"type":"object","properties":{},"additionalProperties":false}"""

# Denote naming, reached the same way from every surface (`NOCTUA.md §16.3`):
# the one builder and the one parser of `nc-ids`, as two commands. Both read
# nothing of the realm's data, so they select the platform's `naming` feature
# rather than the realm — `Read` on `Feature::"naming"`, which the family pack
# gives every person of the realm — and both are reads: an identifier is not
# state, so nothing is kept and nothing could be undone. The arguments are
# never journaled; the entry names the command and the feature.
#
# The bounds: a name is at most 255 bytes, `nc_ids::naming::MAX_BYTES`, and a
# character is a byte at least, so a signature part, a keyword, an extension or
# a name longer than 255 characters can never fit. Each list item that survives
# cleaning costs at least a character and its joiner, so no more than 127 such
# items fit; an item that cleans to nothing costs nothing, so `maxItems` bounds
# the work rather than promising a fit. The title is shortened by the builder
# to fit, so its bound only bounds the work. `id` is the text of an identifier
# a file already carries — kept, so a renamed file is still the same file —
# and without it the machine's one minter mints one.
[[command]]
name = "naming.propose"
title = "command.naming.propose.title"
description = "command.naming.propose.description"
paragraph = "command.naming.propose.paragraph"
tags = "command.naming.propose.tags"
categories = ["noctua.files"]
glyph = "U+F040"   # nf-fa-pencil
action = "Read"
resource_selector = "feature:naming"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{"title":{"type":"string","maxLength":1024},"signature":{"type":"array","items":{"type":"string","maxLength":255},"maxItems":128},"keywords":{"type":"array","items":{"type":"string","maxLength":255},"maxItems":128},"extension":{"type":"string","maxLength":255},"id":{"type":"string","minLength":1,"maxLength":13}},"additionalProperties":false}"""

[[command]]
name = "naming.read"
title = "command.naming.read.title"
description = "command.naming.read.description"
paragraph = "command.naming.read.paragraph"
tags = "command.naming.read.tags"
categories = ["noctua.files"]
glyph = "U+F06E"   # nf-fa-eye
action = "Read"
resource_selector = "feature:naming"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{"name":{"type":"string","minLength":1,"maxLength":255}},"required":["name"],"additionalProperties":false}"""

# Finding a command (`NOCTUA.md §12.4`): the registry filtered by the one fuzzy
# core, every command's names and tags in both languages at once, each word
# answered with the field it matched and its positions there. Like naming, it
# reads nothing of the realm's data, so it selects the platform's `registry`
# feature — `Read` on `Feature::"registry"`, which the family pack gives every
# person of the realm — and it is a read. The query is never journaled.
#
# The bounds: `query` is held to the matcher's own, `nc_fuzzy::QUERY_CHARS_MAX`
# characters, so the schema refuses what the matcher would; `limit` to the most
# an answer lists, whose widest answer fits one frame, and that many are listed
# when it is not given. A test beside the handler holds both
# (`crates/nc-kernel/src/find.rs`).
[[command]]
name = "kernel.find"
title = "command.kernel.find.title"
description = "command.kernel.find.description"
paragraph = "command.kernel.find.paragraph"
tags = "command.kernel.find.tags"
glyph = "U+F002"   # nf-fa-search
action = "Read"
resource_selector = "feature:registry"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{"query":{"type":"string","maxLength":64},"limit":{"type":"integer","minimum":1,"maximum":32}},"required":["query"],"additionalProperties":false}"""

# A setting of the channel (`NOCTUA.md §12.15`): whether MCP is on — whether its
# daemon lets an MCP client in (`§20.3`). A setting is two commands of the
# kernel's own, `settings.<setting>.read` and `settings.<setting>.set`, each on
# the platform's feature of the setting's name — `Read` and `Write` on
# `Feature::"mcp"`, which the family pack gives every person of the realm and
# no agent or device — and the settings are the commands of category
# `noctua.settings`. Neither reads the realm's data. The value is the kernel's
# own entry in the channel's local store, `{"on":false}` until a person writes
# it, and the set writes it in its unit: a step the person's undo takes back,
# never one that left the machine, and never irreversible, since nothing could
# confirm it before the interface (Stage 16). **The set runs only at the top of
# a call tree** (`[NC-KERN-0025]`), so a plugin, a timer or an event run as the
# person never switches it; the read is answered anywhere.
[[command]]
name = "settings.mcp.read"
title = "command.settings.mcp.read.title"
description = "command.settings.mcp.read.description"
paragraph = "command.settings.mcp.read.paragraph"
tags = "command.settings.mcp.read.tags"
categories = ["noctua.settings"]
glyph = "U+F1E6"   # nf-fa-plug
action = "Read"
resource_selector = "feature:mcp"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{},"additionalProperties":false}"""

[[command]]
name = "settings.mcp.set"
title = "command.settings.mcp.set.title"
description = "command.settings.mcp.set.description"
paragraph = "command.settings.mcp.set.paragraph"
tags = "command.settings.mcp.set.tags"
categories = ["noctua.settings"]
glyph = "U+F205"   # nf-fa-toggle_on
action = "Write"
resource_selector = "feature:mcp"
reversibility = "write"
mutating = true
args_schema = """
{"type":"object","properties":{"on":{"type":"boolean"}},"required":["on"],"additionalProperties":false}"""

# The agents a person makes (`NOCTUA.md §14.6`): each an identity of its own,
# minted by the machine's minter, acting for the person who made it and for no
# one else, with a label, a budget a session of it spends, and grants each
# scoped to one feature of the realm, given for a reason and for at most
# `[kernel] agent_grant_minutes_max`. All four are `Feature::"agents"`'s —
# `Write`, `Read`, `Grant` and `Revoke`, which the family pack gives every
# person of the realm and no agent or device — and are listed with the settings,
# since what they change is who may act for the person. **The three that change
# run only at the top of a call tree** (`[NC-KERN-0025]`), so no plugin, timer or
# event run as a person makes, grants or ends an agent in their name; the list
# is answered anywhere. They change the profile's own database outside every
# unit, so a step that ran one is one undo stops at, and each is journaled as
# allowed before it is made, its entry naming the identifiers it made and, for a
# grant, its window — never the label or the reason. The reverse of a grant is
# `agents.revoke`. An agent is never deleted.
#
# The bounds: a label holds what the table holds, one to 64 characters, and a
# reason one to 256; a budget is at most `[kernel] agent_budget_max` and a grant
# runs at most `[kernel] agent_grant_minutes_max` minutes, each held equal to its
# limit by a test beside the commands (`crates/nc-kernel/src/agents.rs`). An
# agent is named by the identifier `agents.create` answered, as `to_crockford`
# writes it — 12 characters for every one minted before about 2034, 13 after —
# and matched whole, never parsed.
[[command]]
name = "agents.create"
title = "command.agents.create.title"
description = "command.agents.create.description"
paragraph = "command.agents.create.paragraph"
tags = "command.agents.create.tags"
categories = ["noctua.settings"]
glyph = "U+F234"   # nf-fa-user_plus
action = "Write"
resource_selector = "feature:agents"
reversibility = "write"
mutating = true
args_schema = """
{"type":"object","properties":{"label":{"type":"string","minLength":1,"maxLength":64},"budget":{"type":"integer","minimum":1,"maximum":100000}},"required":["label","budget"],"additionalProperties":false}"""

[[command]]
name = "agents.list"
title = "command.agents.list.title"
description = "command.agents.list.description"
paragraph = "command.agents.list.paragraph"
tags = "command.agents.list.tags"
categories = ["noctua.settings"]
glyph = "U+F0C0"   # nf-fa-users
action = "Read"
resource_selector = "feature:agents"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{},"additionalProperties":false}"""

[[command]]
name = "agents.grant"
title = "command.agents.grant.title"
description = "command.agents.grant.description"
paragraph = "command.agents.grant.paragraph"
tags = "command.agents.grant.tags"
categories = ["noctua.settings"]
glyph = "U+F084"   # nf-fa-key
action = "Grant"
resource_selector = "feature:agents"
reversibility = "write"
mutating = true
args_schema = """
{"type":"object","properties":{"agent":{"type":"string","minLength":12,"maxLength":13},"feature":{"type":"string","minLength":1,"maxLength":64},"minutes":{"type":"integer","minimum":1,"maximum":43200},"reason":{"type":"string","minLength":1,"maxLength":256}},"required":["agent","feature","minutes","reason"],"additionalProperties":false}"""

[[command]]
name = "agents.revoke"
title = "command.agents.revoke.title"
description = "command.agents.revoke.description"
paragraph = "command.agents.revoke.paragraph"
tags = "command.agents.revoke.tags"
categories = ["noctua.settings"]
glyph = "U+F235"   # nf-fa-user_times
action = "Revoke"
resource_selector = "feature:agents"
reversibility = "write"
mutating = true
args_schema = """
{"type":"object","properties":{"agent":{"type":"string","minLength":12,"maxLength":13},"feature":{"type":"string","minLength":1,"maxLength":64}},"required":["agent"],"additionalProperties":false}"""
