resource_selector = "realm"
reversibility = "write"
mutating = true
args_schema = """
{"type":"object","properties":{},"additionalProperties":false}"""

# Denote naming, reached the same way from every surface (`NOCTUA.md §16.3`):
# the one builder and the one parser of `nc-ids`, as two commands. Both read
# nothing of the realm's data, so they select the platform's `naming` feature
# rather than the realm — `Read` on `Feature::"naming"`, which the family pack
# gives every person of the realm — and both are reads: an identifier is not
# state, so nothing is kept and nothing could be undone. The arguments are
# never journaled; the entry names the command and the feature.
#
# The bounds: a name is at most 255 bytes, `nc_ids::naming::MAX_BYTES`, and a
# character is a byte at least, so a signature part, a keyword, an extension or
# a name longer than 255 characters can never fit. Each list item that survives
# cleaning costs at least a character and its joiner, so no more than 127 such
# items fit; an item that cleans to nothing costs nothing, so `maxItems` bounds
# the work rather than promising a fit. The title is shortened by the builder
# to fit, so its bound only bounds the work. `id` is the text of an identifier
# a file already carries — kept, so a renamed file is still the same file —
# and without it the machine's one minter mints one.
[[command]]
name = "naming.propose"
title = "command.naming.propose.title"
description = "command.naming.propose.description"
paragraph = "command.naming.propose.paragraph"
tags = "command.naming.propose.tags"
categories = ["noctua.files"]
glyph = "U+F040"   # nf-fa-pencil
action = "Read"
resource_selector = "feature:naming"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{"title":{"type":"string","maxLength":1024},"signature":{"type":"array","items":{"type":"string","maxLength":255},"maxItems":128},"keywords":{"type":"array","items":{"type":"string","maxLength":255},"maxItems":128},"extension":{"type":"string","maxLength":255},"id":{"type":"string","minLength":1,"maxLength":13}},"additionalProperties":false}"""

[[command]]
name = "naming.read"
title = "command.naming.read.title"
description = "command.naming.read.description"
paragraph = "command.naming.read.paragraph"
tags = "command.naming.read.tags"
categories = ["noctua.files"]
glyph = "U+F06E"   # nf-fa-eye
action = "Read"
resource_selector = "feature:naming"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{"name":{"type":"string","minLength":1,"maxLength":255}},"required":["name"],"additionalProperties":false}"""

# Finding a command (`NOCTUA.md §12.4`): the registry filtered by the one fuzzy
# core, every command's names and tags in both languages at once, each word
# answered with the field it matched and its positions there. Like naming, it
# reads nothing of the realm's data, so it selects the platform's `registry`
# feature — `Read` on `Feature::"registry"`, which the family pack gives every
# person of the realm — and it is a read. The query is never journaled.
#
# The bounds: `query` is held to the matcher's own, `nc_fuzzy::QUERY_CHARS_MAX`
# characters, so the schema refuses what the matcher would; `limit` to the most
# an answer lists, whose widest answer fits one frame, and that many are listed
# when it is not given. A test beside the handler holds both
# (`crates/nc-kernel/src/find.rs`).
[[command]]
name = "kernel.find"
title = "command.kernel.find.title"
description = "command.kernel.find.description"
paragraph = "command.kernel.find.paragraph"
tags = "command.kernel.find.tags"
glyph = "U+F002"   # nf-fa-search
action = "Read"
resource_selector = "feature:registry"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{"query":{"type":"string","maxLength":64},"limit":{"type":"integer","minimum":1,"maximum":32}},"required":["query"],"additionalProperties":false}"""

# A setting of the channel (`NOCTUA.md §12.15`): whether MCP is on — whether its
# daemon lets an MCP client in (`§20.3`). A setting is two commands of the
# kernel's own, `settings.<setting>.read` and `settings.<setting>.set`, each on
# the platform's feature of the setting's name — `Read` and `Write` on
# `Feature::"mcp"`, which the family pack gives every person of the realm and
# no agent or device — and the settings are listed under category
# `noctua.settings`, beside a person's agents' commands below. Neither reads the
# realm's data. The value is the kernel's
# own entry in the channel's local store, `{"on":false}` until a person writes
# it, and the set writes it in its unit: a step the person's undo takes back,
# never one that left the machine, and never irreversible. **Switching it on
# waits for the person's confirmation in the Noctua window**, as a command that
# cannot be undone does — held while the desktop interface the daemon started is
# attached, refused at once with `[NC-KERN-0032]` otherwise — and so does an
# undo or a redo that would put it back on; switching it off never waits.
# **The set runs only at the top of a call tree**
# (`[NC-KERN-0025]`), so a plugin, a timer or an event run as the person never
# switches it; the read is answered anywhere.
[[command]]
name = "settings.mcp.read"
title = "command.settings.mcp.read.title"
description = "command.settings.mcp.read.description"
paragraph = "command.settings.mcp.read.paragraph"
tags = "command.settings.mcp.read.tags"
categories = ["noctua.settings"]
glyph = "U+F1E6"   # nf-fa-plug
action = "Read"
resource_selector = "feature:mcp"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{},"additionalProperties":false}"""

[[command]]
name = "settings.mcp.set"
title = "command.settings.mcp.set.title"
description = "command.settings.mcp.set.description"
paragraph = "command.settings.mcp.set.paragraph"
tags = "command.settings.mcp.set.tags"
categories = ["noctua.settings"]
glyph = "U+F205"   # nf-fa-toggle_on
action = "Write"
resource_selector = "feature:mcp"
reversibility = "write"
mutating = true
args_schema = """
{"type":"object","properties":{"on":{"type":"boolean"}},"required":["on"],"additionalProperties":false}"""

# The agents a person makes (`NOCTUA.md §14.6`): each an identity of its own,
# minted by the machine's minter, acting for the person who made it and for no
# one else, with a label, a budget a session of it spends, and grants each
# scoped to one feature of the realm, given for a reason and for at most
# `[kernel] agent_grant_minutes_max`. All four are `Feature::"agents"`'s —
# `Write`, `Read`, `Grant` and `Revoke`, which the family pack gives every
# person of the realm and no agent or device — and are listed with the settings,
# since what they change is who may act for the person. **The three that change
# run only at the top of a call tree** (`[NC-KERN-0025]`), so no plugin, timer or
# event run as a person makes, grants or ends an agent in their name; the list
# is answered anywhere. They change the profile's own database outside every
# unit, so a step that ran one is one undo stops at, and each is journaled as
# allowed before it is made, its entry naming the identifiers it made and, for a
# grant, its window — never the label or the reason. The reverse of a grant is
# `agents.revoke`. An agent is never deleted.
#
# The bounds: a label holds what the table holds, one to 64 characters, and a
# reason one to 256; a budget is at most `[kernel] agent_budget_max` and a grant
# runs at most `[kernel] agent_grant_minutes_max` minutes, each held equal to its
# limit by a test beside the commands (`crates/nc-kernel/src/agents.rs`). An
# agent is named by the identifier `agents.create` answered, as `to_crockford`
# writes it — 12 characters for every one minted before about 2034, 13 after —
# and matched whole, never parsed.
[[command]]
name = "agents.create"
title = "command.agents.create.title"
description = "command.agents.create.description"
paragraph = "command.agents.create.paragraph"
tags = "command.agents.create.tags"
categories = ["noctua.settings"]
glyph = "U+F234"   # nf-fa-user_plus
action = "Write"
resource_selector = "feature:agents"
reversibility = "write"
mutating = true
args_schema = """
{"type":"object","properties":{"label":{"type":"string","minLength":1,"maxLength":64},"budget":{"type":"integer","minimum":1,"maximum":100000}},"required":["label","budget"],"additionalProperties":false}"""

[[command]]
name = "agents.list"
title = "command.agents.list.title"
description = "command.agents.list.description"
paragraph = "command.agents.list.paragraph"
tags = "command.agents.list.tags"
categories = ["noctua.settings"]
glyph = "U+F0C0"   # nf-fa-users
action = "Read"
resource_selector = "feature:agents"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{},"additionalProperties":false}"""

[[command]]
name = "agents.grant"
title = "command.agents.grant.title"
description = "command.agents.grant.description"
paragraph = "command.agents.grant.paragraph"
tags = "command.agents.grant.tags"
