# The interface's own state (`NOCTUA.md §12.1`): every action the desktop
# interface performs is one of these, so the CLI and MCP reach it from this one
# declaration (§2.8, §20.1). The kernel holds the state — the windows and each
# one's page stack, the drawer, the sidebar, the footer, the info line, the
# prompt and each seat's focus, hover, selection and drag — in memory, saves it
# to the channel's local store outside every unit, and reads it back when it
# opens (`crates/nc-kernel/src/shell.rs`). Each is decided on the platform's
# `interface` feature — `Read` for `shell.read` and `Write` for the rest, which
# the family pack gives every person of the realm and no agent or device — and
# **each is a read, its reversibility `read` and not mutating, on
# purpose**: what the interface shows is not state a person's undo should take
# back, so none opens a unit, none is a step, and an undo passes over them all
# to the person's last real change — the precedent is `naming.propose`, a read
# that advances the machine's minter, and a surface a read renders. Each is
# journaled once all the same, its entry naming the command and the feature and
# never the arguments, and what it changes is held until its call tree ends with
# its entries taken, as a surface is. What changes at the rate the interface
# draws — a scroll, the draft, a hover — reaches the daemon as a note, which is
# no command; these are the same changes asked one at a time.
#
# The bounds: a seat is at most `[kernel] shell_seats_max`; a window is never
# narrower than `shell_window_min_width` nor shorter than
# `shell_window_min_height`, in CSS pixels, its size held to the 16 bits an X
# window's size is written in and its place to the 16 bits of its position;
# the drawer takes at most `shell_drawer_share_max` percent; a topic, a hover's
# or a drag's target and a parameter's name are at most 64 characters of
# letters, digits and `-_.:/`, a command's name at most
# `nc_schema::descriptor::NAME_MAX`, and the draft and the info line's message at
# most `shell_text_bytes` — each schema bound held equal to its limit by a test
# beside the commands. Stage 17's workspaces, layout modes and page arrangement
# are not here.

[[command]]
name = "shell.read"
title = "command.shell.read.title"
description = "command.shell.read.description"
paragraph = "command.shell.read.paragraph"
tags = "command.shell.read.tags"
action = "Read"
resource_selector = "feature:interface"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{},"additionalProperties":false}"""

[[command]]
name = "shell.focus"
title = "command.shell.focus.title"
description = "command.shell.focus.description"
paragraph = "command.shell.focus.paragraph"
tags = "command.shell.focus.tags"
action = "Write"
resource_selector = "feature:interface"
reversibility = "read"
mutating = false
args_schema = """
{"type":"object","properties":{"seat":{"type":"integer","minimum":1,"maximum":4},"window":{"type":"integer","minimum":1},"region":{"type":"string","enum":["workspace","drawer","prompt","sidebar","info","modeline"]}},"required":["region"],"additionalProperties":false}"""

