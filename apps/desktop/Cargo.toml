[package]
name = "nc-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The desktop interface: a window and its webview, a view of the interface's state the daemon holds, which it mirrors and changes only by commands and notes."

# **A library and a thin binary, and the library holds no kernel.** What the
# interface does is the library's — follow the daemon's state, draw it, send
# what a person does as a command or a note — and `noctua-desktop` reads its
# arguments and prints. No `nc-kernel` and no `nc-daemon`, here or under them:
# the interface reaches a kernel only through the daemon's endpoint, as the CLI
# does (`NOCTUA.md §12.1`).
[[bin]]
name = "noctua-desktop"
path = "src/main.rs"

[dependencies]
# The codes every refusal carries (`NOCTUA.md §15.1`), and the bounds the
# daemon holds a watch and a heartbeat to, which this reads and takes from no
# caller (`DAEMON`), and a window's least size (`KERNEL`).
nc-catalog.workspace = true
# The interface's state as the daemon sends it, read by the mirror, and a
# command's arguments and a note's facts written as the one canonical form.
nc-canon.workspace = true
# The install beside the executable, which names the daemon this window is a
# view of (`§17.1`).
nc-channel.workspace = true
# The protocol, and the one client every program asks a daemon through
# (`nc_ipc::client`): the handshake that proves both ends, a watch and a note.
nc-ipc.workspace = true
# **The one call that puts the webview into the window**, which each system
# makes its own way, behind the feature only this crate turns on
# (`nc_platform::webview`, `§2.7`).
nc-platform = { workspace = true, features = ["webview"] }
# The window, its event loop, and the system's webview in it. The root
# manifest says why each is taken directly, and pinned.
tao.workspace = true
wry.workspace = true
# The interface's markup, written as `rsx!` (`NOCTUA.md §4`), and the first
# frame of it rendered into the document the webview is handed, before the
# window is ever shown.
dioxus.workspace = true
dioxus-ssr.workspace = true
# The runtime the two connections to the daemon run on, one thread each
# (`rt`), the endpoint's socket or pipe (`net`), and the protocol's bounds and
# the wait between two tries (`time`). Already in the graph with each; never
# `process` or `signal`.
tokio = { workspace = true, features = ["rt", "net", "time"] }

[dev-dependencies]
# **Itself, so the documentation gate can read this crate's integration
# tests**, as every crate with a `tests/` suite does.
nc-desktop = { path = "." }
# The doors a test stages a scratch directory through.
nc-platform = { workspace = true, features = ["test-support", "webview"] }
# The scratch install and the scripted daemon this crate's tests connect to,
# so none of them starts a daemon process.
nc-ipc = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
