[package]
name = "nc-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The daemon a channel runs: the install it names itself by, its profile, its device, the identifiers' mark, and the kernel it serves at its endpoint."

# **A library and a thin binary.** What the daemon does is the library's, and
# `noctua-daemon` reads its arguments and prints; a mutation of either is
# judged by the unit tests of the module it is in, and the suites in `tests/`,
# which run the binary and a child of their own, are evidence beside them.
[[bin]]
name = "noctua-daemon"
path = "src/main.rs"

[features]
# The install a suite runs a real daemon in (`nc_daemon::testing`), under a
# scratch root of its own. **Off by default**, so nothing shipped reaches it.
test-support = ["nc-platform/test-support"]

[dependencies]
# The codes every refusal carries (`NOCTUA.md §15.1`), and `DAEMON`, the bounds
# the daemon holds itself to.
nc-catalog.workspace = true
# The install's manifest and every name it derives (`§17.1`).
nc-channel.workspace = true
# Who runs this, a path judged this user's alone, a file and a directory created
# private, and the system's random bytes a device's seed is drawn from.
nc-platform.workspace = true
# The minter, its ceiling and the flake (`§16.2`).
nc-ids.workspace = true
# The world a profile decides as, read with the pack its realm selects.
nc-authz.workspace = true
# A device's record and a world file, read as the one canonical form.
nc-canon.workspace = true
# The event a clock moved back is logged as, and the sink the kernel is opened
# with, which the daemon writes its own events to as well.
nc-log.workspace = true
nc-kernel.workspace = true
# A device's key (`§16.2`): the public key its flake and its identifier derive
# from. `default-features = false` and `zeroize` alone, so no `rand_core` — the
# seed is drawn by `nc-platform` — and the key is wiped when it is dropped.
ed25519-dalek.workspace = true
# The checksum each slot of the identifiers' mark carries.
blake3.workspace = true
# The local database the kernel keeps a person's data and its journal in, one
# file in the profile's data directory (`NOCTUA.md §4`).
nc-local.workspace = true
# The journal over that file, sharing the profile's one minter.
nc-journal.workspace = true
# The protocol the daemon serves at its endpoint (`§11.1`).
nc-ipc.workspace = true
# How a command's reversibility is spelled in the registry the daemon answers.
nc-schema.workspace = true
# The runtime the kernel, the endpoint and the schedule run on: the workspace's
# `rt-multi-thread`, so a plugin running on one worker never holds up the
# heartbeat of a connection on another, and `time` and `sync` for the schedule
# and the stop. Already in the graph with each; never `process` or `signal`.
tokio = { workspace = true, features = ["time", "sync"] }

[dev-dependencies]
# **Itself, so the documentation gate can read this crate's integration
# tests**, as every crate with a `tests/` suite does.
nc-daemon = { path = ".", features = ["test-support"] }
# The doors a test stages a path through, and the capture a test reads the
# daemon's events back from.
nc-platform = { workspace = true, features = ["test-support"] }
nc-kernel = { workspace = true, features = ["test-support"] }
# A stopped daemon's journal, read back where it kept it.
nc-local = { workspace = true, features = ["test-support"] }
# A connection a test serves in memory, its client taking one byte at a time
# (`tokio::io::duplex`). Already in the graph with `io-util`.
tokio = { workspace = true, features = ["io-util"] }
# The CLI, driven in-process against a real daemon by the suites that hold
# every command and every exit code to what the daemon answers.
nc-cli.workspace = true

[lints]
workspace = true
