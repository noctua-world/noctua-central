# The formatter's configuration, pinned so the generated bytes are the same
# everywhere.
#
# **This file exists because of a measurement.** `cargo xtask build` pipes every
# generated Rust file through `rustfmt` from `PATH`, and rustfmt discovers its
# configuration by walking *up* from its working directory. Without a file here
# that walk leaves the repository: a `rustfmt.toml` one level above — in the
# workspace root, invisible to every gate in this tree — changed six of the
# fifteen generated files, and `cargo xtask check` still reported
# `two generations are byte-identical` and `15 generated file(s) match the
# catalog`. Both are true and neither is the claim: the determinism check runs
# two generations in one process, so anything constant within that process is
# invisible to it.
#
# So the walk stops here. `edition` is the only setting, and it is the one that
# changes how code is *parsed* rather than how it is laid out — everything else
# is rustfmt's default on purpose, because a formatting preference in this file
# is a preference two repositories would then have to agree about.
edition = "2024"
