# A one-off measurement, removed by the next commit: what a filtered token
# (no Administrators, no privileges, Medium) may open of each process on the
# hosted Windows runner, beside what the runner's own elevated token may.

name: probe

on:
  push:
    branches: [stage-13/cli]

permissions: {}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: What a filtered token may open
        shell: powershell
        run: |
          whoami /priv | Select-String -Pattern "Debug|Impersonate"
          whoami /groups | Select-String -Pattern "Mandatory|Administrators"
          $source = @'
          using System;
          using System.Collections.Generic;
          using System.Diagnostics;
          using System.Runtime.InteropServices;
          using System.Security.Principal;
          using System.Text;

          public static class Probe {
              [DllImport("kernel32.dll", SetLastError = true)] static extern IntPtr OpenProcess(uint access, bool inherit, uint pid);
              [DllImport("kernel32.dll", SetLastError = true)] static extern bool CloseHandle(IntPtr h);
              [DllImport("kernel32.dll", SetLastError = true)] static extern bool GetProcessTimes(IntPtr h, out long c, out long e, out long k, out long u);
              [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)] static extern bool QueryFullProcessImageNameW(IntPtr h, uint flags, StringBuilder name, ref uint size);
              [DllImport("kernel32.dll")] static extern IntPtr GetCurrentProcess();
              [DllImport("advapi32.dll", SetLastError = true)] static extern bool OpenProcessToken(IntPtr p, uint access, out IntPtr t);
              [DllImport("advapi32.dll", SetLastError = true)] static extern bool CreateRestrictedToken(IntPtr existing, uint flags, uint disableCount, SID_AND_ATTRIBUTES[] disable, uint deleteCount, IntPtr delete, uint restrictCount, IntPtr restrict, out IntPtr created);
              [DllImport("advapi32.dll", SetLastError = true)] static extern bool ImpersonateLoggedOnUser(IntPtr t);
              [DllImport("advapi32.dll", SetLastError = true)] static extern bool RevertToSelf();
              [DllImport("advapi32.dll", SetLastError = true)] static extern bool SetTokenInformation(IntPtr t, int cls, ref TOKEN_MANDATORY_LABEL info, uint length);
              [DllImport("advapi32.dll")] static extern uint GetLengthSid(IntPtr sid);
              [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)] static extern bool ConvertStringSidToSidW(string s, out IntPtr sid);
              [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)] static extern bool ConvertStringSecurityDescriptorToSecurityDescriptorW(string sddl, uint revision, out IntPtr sd, IntPtr size);
              [DllImport("advapi32.dll", SetLastError = true)] static extern bool SetKernelObjectSecurity(IntPtr h, uint info, IntPtr sd);

              [StructLayout(LayoutKind.Sequential)] public struct SID_AND_ATTRIBUTES { public IntPtr Sid; public uint Attributes; }
              [StructLayout(LayoutKind.Sequential)] public struct TOKEN_MANDATORY_LABEL { public SID_AND_ATTRIBUTES Label; }

              static string Labelled = "";
              const uint LIMITED = 0x1000, FULL = 0x1000 | 0x0001 | 0x00100000;

              static string Tried(uint pid, uint access) {
                  IntPtr h = OpenProcess(access, false, pid);
                  if (h == IntPtr.Zero) return "err" + Marshal.GetLastWin32Error();
                  string said = "ok";
                  if (access == LIMITED) {
                      long c, e, k, u;
                      said += GetProcessTimes(h, out c, out e, out k, out u) ? "+times" : "-times" + Marshal.GetLastWin32Error();
                      StringBuilder name = new StringBuilder(1024); uint size = 1024;
                      said += QueryFullProcessImageNameW(h, 0, name, ref size) ? "+image" : "-image" + Marshal.GetLastWin32Error();
                      IntPtr t;
                      if (OpenProcessToken(h, 0x0008, out t)) { said += "+token"; CloseHandle(t); } else { said += "-token" + Marshal.GetLastWin32Error(); }
                  }
                  CloseHandle(h);
                  return said;
              }

              static string Owner(uint pid) {
                  IntPtr h = OpenProcess(LIMITED, false, pid);
                  if (h == IntPtr.Zero) return "?";
                  string name = "?";
                  IntPtr t;
                  if (OpenProcessToken(h, 0x0008, out t)) {
                      try { using (WindowsIdentity id = new WindowsIdentity(t)) { name = id.Name; } } catch (Exception ex) { name = "?" + ex.GetType().Name; }
                      CloseHandle(t);
                  }
                  CloseHandle(h);
                  return name;
              }

              static IntPtr Filtered() {
                  IntPtr self;
                  if (!OpenProcessToken(GetCurrentProcess(), 0x0001 | 0x0002 | 0x0008, out self)) throw new Exception("own token " + Marshal.GetLastWin32Error());
                  IntPtr admins;
                  ConvertStringSidToSidW("S-1-5-32-544", out admins);
                  SID_AND_ATTRIBUTES[] disable = new SID_AND_ATTRIBUTES[] { new SID_AND_ATTRIBUTES { Sid = admins, Attributes = 0 } };
                  IntPtr restricted;
                  if (!CreateRestrictedToken(self, 0x1 | 0x4, 1, disable, 0, IntPtr.Zero, 0, IntPtr.Zero, out restricted)) throw new Exception("restricted " + Marshal.GetLastWin32Error());
                  IntPtr medium;
                  ConvertStringSidToSidW("S-1-16-8192", out medium);
                  TOKEN_MANDATORY_LABEL label = new TOKEN_MANDATORY_LABEL { Label = new SID_AND_ATTRIBUTES { Sid = medium, Attributes = 0x20 } };
                  Labelled = SetTokenInformation(restricted, 25, ref label, (uint)Marshal.SizeOf(label) + GetLengthSid(medium)) ? "medium" : "unchanged " + Marshal.GetLastWin32Error();
                  return restricted;
              }

              public static string Run() {
                  StringBuilder o = new StringBuilder();
                  IntPtr filtered = Filtered();
                  if (!ImpersonateLoggedOnUser(filtered)) throw new Exception("impersonate " + Marshal.GetLastWin32Error());
                  try {
                      WindowsPrincipal principal = new WindowsPrincipal(WindowsIdentity.GetCurrent());
                      o.AppendLine("filtered: administrator " + principal.IsInRole(WindowsBuiltInRole.Administrator) + ", label " + Labelled);
                  } finally { RevertToSelf(); }
                  string me = WindowsIdentity.GetCurrent().User.Value;
                  Process child = Process.Start(new ProcessStartInfo("ping.exe", "-n 120 127.0.0.1") { UseShellExecute = false, CreateNoWindow = true, RedirectStandardOutput = true });
                  IntPtr sd;
                  if (!ConvertStringSecurityDescriptorToSecurityDescriptorW("D:P(A;;0x1000;;;" + me + ")", 1, out sd, IntPtr.Zero)) throw new Exception("sddl " + Marshal.GetLastWin32Error());
                  o.AppendLine("child " + child.Id + " access list set: " + SetKernelObjectSecurity(child.Handle, 0x4, sd) + " " + Marshal.GetLastWin32Error());
                  List<Process> all = new List<Process>(Process.GetProcesses());
                  all.Sort((a, b) => a.Id.CompareTo(b.Id));
                  o.AppendLine("pid\tname\towner\televated-full\televated-limited\tfiltered-full\tfiltered-limited");
                  foreach (Process p in all) {
                      uint pid = (uint)p.Id;
                      string owner = Owner(pid);
                      string ef = Tried(pid, FULL), el = Tried(pid, LIMITED), ff, fl;
                      if (!ImpersonateLoggedOnUser(filtered)) throw new Exception("impersonate " + Marshal.GetLastWin32Error());
                      try { ff = Tried(pid, FULL); fl = Tried(pid, LIMITED); } finally { RevertToSelf(); }
                      o.AppendLine(pid + "\t" + p.ProcessName + (pid == (uint)child.Id ? "(child)" : "") + "\t" + owner + "\t" + ef + "\t" + el + "\t" + ff + "\t" + fl);
                  }
                  try { child.Kill(); } catch (Exception ex) { o.AppendLine("kill " + ex.Message); }
                  return o.ToString();
              }
          }
          '@
          Add-Type -TypeDefinition $source
          [Probe]::Run()
