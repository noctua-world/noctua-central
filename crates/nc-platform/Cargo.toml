[package]
name = "nc-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Who this process runs as, a directory or a file private to that user, and the system's random bytes: the one place each system's answer is written."

[features]
# The doors other crates' suites stage a path through: one another user can
# reach, one its owner cannot write, a link, and what a path lets in, read back
# so a refused one can be held to what it was. **Off by default**, so nothing
# shipped can loosen a path through this crate.
test-support = []

# **The Win32 security calls, and nothing else of Windows** (`NOCTUA.md §2.3`,
# decided 2026-11-02): who the token says this process is, an access list built
# and read, a file and a directory created with one, a handle's attributes, and
# the system's generator of random bytes (`Win32_Security_Cryptography`, for
# `BCryptGenRandom` alone).
# Each feature is a module of the declarations this crate calls, and none is
# turned on for a call it does not make. Already in the graph at this version,
# under `tokio`'s `mio`, so it adds no package; compiled only for a Windows
# target. Not written here because the declarations would be ours to get right,
# layout for layout, with no compiler to check them against the system's.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    # Which process is at the other end of the daemon's pipe, asked from either
    # end (`GetNamedPipeClientProcessId`, `GetNamedPipeServerProcessId`).
    "Win32_System_Pipes",
] }

[dependencies]
# **The IPC endpoint's socket and pipe, and nothing else of the runtime**
# (`NOCTUA.md §11.1`): a Unix socket's listener and stream with the peer's
# credentials, and a Windows named pipe's server and client. Here and not in a
# crate above, because the call that creates a pipe with a security descriptor
# of its own, `create_with_security_attributes_raw`, is `unsafe`, and this is
# the one crate that may write it, in `src/windows.rs`. `net` is the socket and
# the pipe, `io-util` the reads and writes a test makes through them, and `time`
# the wait before a pipe whose every instance is busy is asked again. Already in
# the graph, with each of these features, under `sqlx`, so it adds no package
# and no feature; never `process` or `signal`.
tokio = { workspace = true, features = ["net", "io-util", "time"] }

[dev-dependencies]
# **Itself, with the doors open**, so the documentation gate can read this
# crate's suite and the suite can stage a path another user can reach. Cargo
# resolves it to this same unit, so nothing is built twice.
nc-platform = { path = ".", features = ["test-support"] }

# **The workspace's lints, written out, with one word changed.** The workspace
# sets `unsafe_code = "forbid"`, and a `forbid` cannot be lifted by anything
# under it, so a crate taking `workspace = true` could not hold the Windows
# module at all. Here it is `deny`: refused everywhere in this crate as it is
# everywhere else, and allowed on `src/windows.rs` alone, by the one attribute
# on that `mod` line. Every other line is the workspace's own, and
# `every_member_takes_the_workspace_lints` holds this table to that one, entry
# for entry, so the two cannot drift apart.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
