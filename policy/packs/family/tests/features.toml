# The `family` pack's permits over the platform's features, and the boundary of
# each.
#
# Each permit is shown firing and shown refusing just outside itself: a verb it
# does not give, a kind of principal it does not let in, and a feature it does
# not name. The runner re-runs every refusal with every `forbid` removed, so a
# case still denied is one about the permit and not about a floor.
#
# An agent's permit is refused for its kind of principal with a device marked
# as acting through an agent: a person would be let in by the person's permit,
# and an agent not so marked is refused by the core, so neither is a boundary of
# the agent's permit.

[default.context]
now = { datetime = "2026-08-26T00:00:00Z" }
via_agent = false
confirmed_by_human = false
actor_chain_depth = 0
policy_epoch = 7
quorum_met = true
grant = { entity = 'Grant::"g.current"' }

[[case]]
name = "a member of the house has a file named"
principal = 'User::"carla"'
action = "Read"
resource = 'Feature::"naming"'
decision = "allow"
because = "family.a_member_names_files"

[[case]]
# A child as much as an adult: naming reads nothing of anybody's.
name = "and so does a child of the house"
principal = 'User::"bruno"'
action = "Read"
resource = 'Feature::"naming"'
decision = "allow"
because = "family.a_member_names_files"

[[case]]
# **The verb.** Naming is a read, and with the permit's action dropped a member
# would be given every verb over the feature.
name = "a member has a file named and writes nothing to the feature"
the_action_is_the_boundary = true
principal = 'User::"carla"'
action = "Write"
resource = 'Feature::"naming"'
decision = "deny"
no_permit_matched = "family.a_member_names_files"

[[case]]
# **Who is asking.** Ana's laptop is attested, so no floor refuses it; the
# permit's `principal is User` is what does, and with the type test deleted
# this exact request is allowed.
name = "a device of the house has no file named, however attested"
the_principal_is_the_boundary = true
principal = 'Device::"ana-laptop"'
action = "Read"
resource = 'Feature::"naming"'
decision = "deny"
no_permit_matched = "family.a_member_names_files"

[[case]]
# **The agent's own permit — half of what it is answered.** The decision point
# asks this as the agent and again as its operator, and allows only what both
# allow (`NOCTUA.md §14.6`); this is the agent's half, marked as an agent's,
# one link from the person it acts for.
name = "an agent of the house has a file named, for the person it acts for"
principal = 'Agent::"ana-assistant"'
action = "Read"
resource = 'Feature::"naming"'
context = { via_agent = true, actor_chain_depth = 1 }
decision = "allow"
because = "family.an_agent_names_files"

[[case]]
# **The other half.** The same request asked as the operator, marked as an
# agent's: the person's own permit answers it, and no core `forbid` refuses it.
name = "the person an agent acts for has the file named too, as the other half of its answer"
principal = 'User::"ana"'
action = "Read"
resource = 'Feature::"naming"'
context = { via_agent = true, actor_chain_depth = 1 }
decision = "allow"
because = "family.a_member_names_files"

[[case]]
# **The verb**, for the agent's permit: naming is a read, and with the
# permit's action dropped an agent would be given every verb over the feature.
name = "an agent has a file named and writes nothing to the feature"
the_action_is_the_boundary = true
principal = 'Agent::"ana-assistant"'
action = "Write"
resource = 'Feature::"naming"'
context = { via_agent = true, actor_chain_depth = 1 }
decision = "deny"
no_permit_matched = "family.an_agent_names_files"

[[case]]
# **Who is asking, for the agent's permit.** A person is let in by the person's
# permit and an unmarked agent is refused by the core, so the boundary is a
# device marked as acting through an agent: asked as the agent, this request is
# allowed, and only the type test refuses it here.
name = "a device in an agent's chain has no file named by the agent's permit"
the_principal_is_the_boundary = true
principal = 'Device::"ana-laptop"'
action = "Read"
resource = 'Feature::"naming"'
context = { via_agent = true, actor_chain_depth = 1 }
decision = "deny"
no_permit_matched = "family.an_agent_names_files"

[[case]]
# **The feature it names**, for the agent's permit: `gallery`, which no other
# permit gives an agent.
name = "the agent's naming permit reaches no other feature"
principal = 'Agent::"ana-assistant"'
action = "Read"
resource = 'Feature::"gallery"'
context = { via_agent = true, actor_chain_depth = 1 }
decision = "deny"
no_permit_matched = "family.an_agent_names_files"

[[case]]
# **Cedar's answer without the directory, pinned** as the person's is: the
# permit asks no membership, so an agent of another realm is allowed over the
# whole world, and the decision point's slice of `home` denies it.
name = "an outsider's agent has a file named, which only the decision point refuses"
principal = 'Agent::"mallory-assistant"'
action = "Read"
resource = 'Feature::"naming"'
context = { via_agent = true, actor_chain_depth = 1 }
decision = "allow"
because = "family.an_agent_names_files"

[[case]]
# **The feature it names.** With the resource constraint dropped, the permit
# would let a member read every feature the realm holds.
name = "the naming permit reaches no other feature"
principal = 'User::"carla"'
action = "Read"
resource = 'Feature::"gallery"'
decision = "deny"
no_permit_matched = "family.a_member_names_files"

[[case]]
# **Cedar's answer without the directory, pinned rather than left implicit.**
# The permit asks no membership, for the reason `features.cedar` gives, so over
# the whole world a person of another realm is allowed it; the decision point's
# slice of `home` holds no `User::"mallory"` and denies her. That this answer is
# `allow` here is the finding, written down: the day the permit or a core
# `forbid` narrows it, this case flips and somebody decides on purpose.
name = "an outsider has a file named, which only the decision point refuses"
principal = 'User::"mallory"'
action = "Read"
resource = 'Feature::"naming"'
decision = "allow"
because = "family.a_member_names_files"

