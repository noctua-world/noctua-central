# What the reference plugin says of each command it declares (`NOCTUA.md
# §20.4`), one row per command, by the name it has inside the plugin's
# namespace: `note.get` is registered as `reference.note.get`, or as
# `peer.note.get` when a store gives the plugin that namespace, so one table
# serves both. Each row's texts are in `i18n/`, one file per locale.
#
# A row names its categories and its glyph when it has them: every row here
# is listed under `noctua.reference`, the platform's set for this plugin, and
# none has a glyph. The kernel holds every row to the judge the catalog's commands
# are held to, at `activate`; a command declared with no row is refused, and
# the English display name of each is the title the component declares.
# Editing any of these files makes the component stale: `cargo xtask build
# --plugins` builds it again.

